  /* ---------- geração de PDF das placas promocionais ----------
     Layout replicando a placa física da Oriundi: 205 x 102 mm,
     faixa vermelha vertical de 45 mm à esquerda, fonte Poppins.
     Todos os textos se auto-ajustam para nunca estourar a área. */
  var PDF_RED  = [245, 63, 58];
  var PDF_INK  = [35, 31, 32];
  var PDF_GRAY = [120, 120, 120];
  var MM2PT = 2.8346;   // 1 mm em pontos
  var CAP   = 0.70;     // altura de caixa alta do Poppins ~70% do corpo
  function emParaCap(capMm){ return capMm / CAP; }
  function setF(doc, fonte, emMm){ doc.setFont(fonte,'normal'); doc.setFontSize(emMm*MM2PT); }

  /* Altura de caixa alta de cada fonte, como fração do corpo.
     Permite pedir "quero letra de X mm" e obter o mesmo tamanho visual
     independentemente da fonte usada. */
  var CAP_RATIO = { PopB:0.70, PopS:0.70, Ant:0.8594 };
  function setCap(doc, fonte, capMm){
    doc.setFont(fonte,'normal');
    doc.setFontSize((capMm / (CAP_RATIO[fonte] || 0.70)) * MM2PT);
  }

  function registrarFontesPDF_(doc){
    doc.addFileToVFS('PopB.ttf', POPPINS_BLACK_B64);
    doc.addFont('PopB.ttf','PopB','normal');
    doc.addFileToVFS('PopS.ttf', POPPINS_SEMI_B64);
    doc.addFont('PopS.ttf','PopS','normal');
    doc.addFileToVFS('Ant.ttf', ANTON_B64);
    doc.addFont('Ant.ttf','Ant','normal');
  }

  /* ícones das redes sociais, desenhados vetorialmente (sem imagens externas) */
  function icFacebook(doc,x,y,s){
    doc.setFillColor(24,119,242);
    doc.circle(x+s*0.5,y+s*0.5,s*0.5,'F');
    doc.setTextColor(255,255,255); setF(doc,'PopB',emParaCap(s*0.60));
    doc.text('f', x+s*0.50, y+s*0.80, {align:'center'});
  }
  function icInstagram(doc,x,y,s){
    doc.setFillColor(PDF_RED[0],PDF_RED[1],PDF_RED[2]);
    doc.roundedRect(x,y,s,s,s*0.28,s*0.28,'F');
    doc.setDrawColor(255,255,255); doc.setLineWidth(s*0.085);
    doc.roundedRect(x+s*0.20,y+s*0.20,s*0.60,s*0.60,s*0.20,s*0.20,'S');
    doc.circle(x+s*0.50,y+s*0.50,s*0.17,'S');
    doc.setFillColor(255,255,255); doc.circle(x+s*0.70,y+s*0.30,s*0.05,'F');
  }
  function icYoutube(doc,x,y,s){
    doc.setFillColor(PDF_RED[0],PDF_RED[1],PDF_RED[2]);
    doc.roundedRect(x,y+s*0.12,s*1.40,s*0.76,s*0.22,s*0.22,'F');
    doc.setFillColor(255,255,255);
    doc.triangle(x+s*0.56,y+s*0.30, x+s*0.56,y+s*0.70, x+s*0.90,y+s*0.50,'F');
  }
  /* Reduz o corpo da fonte até o texto caber em `maxLinhas`. */
  function ajustarCapPDF_(doc, texto, largMax, fonte, capIni, maxLinhas, capMin){
    var cap = capIni;
    while(cap > capMin){
      setCap(doc, fonte, cap);
      var linhas = doc.splitTextToSize(texto, largMax);
      if(linhas.length <= maxLinhas) return {cap:cap, linhas:linhas, truncado:false};
      cap -= capIni*0.03;
    }
    setCap(doc, fonte, capMin);
    var todas2 = doc.splitTextToSize(texto, largMax);
    var cort2 = todas2.slice(0, maxLinhas);
    var trunc2 = todas2.length > maxLinhas;
    if(trunc2 && cort2.length){
      cort2[cort2.length-1] = cort2[cort2.length-1].replace(/\s+\S*$/,'') + '...';
    }
    return {cap:capMin, linhas:cort2, truncado:trunc2};
  }

  function ajustarTextoPDF_(doc, texto, largMax, fonte, emIni, maxLinhas, emMin){
    var em = emIni;
    while(em > emMin){
      setF(doc, fonte, em);
      var linhas = doc.splitTextToSize(texto, largMax);
      if(linhas.length <= maxLinhas) return {em:em, linhas:linhas};
      em -= emIni*0.03;
    }
    setF(doc, fonte, emMin);
    var todas = doc.splitTextToSize(texto, largMax);
    var cortadas = todas.slice(0, maxLinhas);
    var truncado = todas.length > maxLinhas;
    if(truncado && cortadas.length){
      cortadas[cortadas.length-1] = cortadas[cortadas.length-1].replace(/\s+\S*$/,'') + '...';
    }
    return {em:emMin, linhas:cortadas, truncado:truncado};
  }

  function desenharPlacaPDF_(doc, item, x, y, w, h){
    var k = h/102;                       // layout desenhado para 205 x 102 mm
    doc.setFillColor(255,255,255); doc.rect(x,y,w,h,'F');
    doc.setDrawColor(215,215,215); doc.setLineWidth(0.2); doc.rect(x,y,w,h);

    // ---- faixa vermelha vertical com "OFERTA" ----
    var faixaW = w*0.1686;
    doc.setFillColor(PDF_RED[0],PDF_RED[1],PDF_RED[2]);
    doc.roundedRect(x,y,faixaW,h,2.5*k,2.5*k,'F');
    doc.setTextColor(255,255,255);
    setCap(doc,'Ant',10);
    var w10 = doc.getTextWidth('OFERTA');
    var capOfer = Math.min(10*(h*0.80)/w10, faixaW*0.60);
    setCap(doc,'Ant',capOfer);
    var oferW = doc.getTextWidth('OFERTA');
    doc.text('OFERTA', x+faixaW/2+capOfer*0.42, y+h/2+oferW/2, {angle:90});

    var cx = x+faixaW, cw = w-faixaW, pad = 4*k;
    var areaX = cx+pad, areaW = cw-pad*2;
    var centro = cx + cw/2;

    // ---- descrição: 1ª linha grande, restante menor, centralizadas ----
    doc.setTextColor(PDF_INK[0],PDF_INK[1],PDF_INK[2]);
    var nomeTxt = String(item.nome||'').toUpperCase();
    var capL1 = 10*k;
    setCap(doc,'Ant',capL1);
    var partes = doc.splitTextToSize(nomeTxt, areaW);
    if(partes.length === 1){
      doc.text(partes[0], centro, y+18.5*k, {align:'center'});
    } else {
      // primeira linha no tamanho cheio, o resto reduzido numa segunda linha
      var resto = nomeTxt.substring(partes[0].length).trim();
      doc.text(partes[0], centro, y+18.5*k, {align:'center'});
      var f2 = ajustarCapPDF_(doc, resto, areaW, 'Ant', 6.5*k, 1, 3*k);
      doc.text(f2.linhas[0], centro, y+28.5*k, {align:'center'});
    }

    // ---- caixa vermelha do preço POR (ou do texto promocional) ----
    var bx = x+w*0.394, by = y+h*0.329, bw = w*0.544, bh = h*0.461;
    var temPor = !!item.precoPor;
    if(temPor || item.infoPlaca){
      doc.setFillColor(PDF_RED[0],PDF_RED[1],PDF_RED[2]);
      doc.roundedRect(bx,by,bw,bh,4*k,4*k,'F');
      doc.setTextColor(255,255,255);
    }

    if(temPor){
      setCap(doc,'Ant',6*k);
      doc.text('POR:', bx+bw*0.055, by+bh*0.19);
      var p = Number(item.precoPor).toFixed(2).split('.');
      /* O corpo do preço varia com a quantidade de dígitos: com poucos
         dígitos cresce, evitando sobrar vermelho ocioso; com muitos,
         encolhe. Os demais elementos acompanham na mesma proporção. */
      var nd = p[0].replace(/\D/g,'').length;
      var fatorDig = nd<=1 ? 1.25 : (nd===2 ? 1.10 : (nd===3 ? 0.95 : 0.78));
      var capBase = 30*k*fatorDig;
      var medirCap = function(cd){
        setCap(doc,'Ant',cd*0.294); var a=doc.getTextWidth('R$');
        setCap(doc,'Ant',cd);       var b=doc.getTextWidth(p[0]);
        setCap(doc,'Ant',cd*0.353); var c=doc.getTextWidth(','+p[1]);
        setCap(doc,'Ant',cd*0.191); var d=doc.getTextWidth('UNID.');
        return {rs:a, int:b, cent:c, un:d, total:a+cd*0.06+b+cd*0.06+Math.max(c,d)};
      };
      var escW = (bw*0.86)/medirCap(capBase).total;   // não estourar a largura
      var escH = (bh*0.78)/capBase;                   // nem a altura da caixa
      var capDig = capBase*Math.min(1, escW, escH);
      var m = medirCap(capDig);
      var gx = bx + (bw - m.total)/2;                 // grupo centralizado
      var gBase = by+bh*0.86;
      setCap(doc,'Ant',capDig*0.294);
      doc.text('R$', gx, gBase-capDig*0.26);
      setCap(doc,'Ant',capDig);
      doc.text(p[0], gx+m.rs+capDig*0.06, gBase);
      var cX = gx+m.rs+capDig*0.06+m.int+capDig*0.06;
      setCap(doc,'Ant',capDig*0.353);
      doc.text(','+p[1], cX, gBase-capDig*0.66);
      setCap(doc,'Ant',capDig*0.191);
      doc.text('UNID.', cX, gBase-capDig*0.06);
    } else if(item.infoPlaca){
      var f3 = ajustarCapPDF_(doc, String(item.infoPlaca).toUpperCase(), bw*0.88, 'Ant', 11*k, 2, 4*k);
      if(f3.linhas.length===1){
        doc.text(f3.linhas[0], bx+bw/2, by+bh*0.62, {align:'center'});
      } else {
        doc.text(f3.linhas[0], bx+bw/2, by+bh*0.45, {align:'center'});
        doc.text(f3.linhas[1], bx+bw/2, by+bh*0.80, {align:'center'});
      }
    }

    // ---- coluna DE: (à esquerda da caixa) ----
    if(item.precoDe){
      var dx = cx+cw*0.045;
      doc.setTextColor(PDF_INK[0],PDF_INK[1],PDF_INK[2]);
      setCap(doc,'Ant',4*k); doc.text('DE:', dx, y+38*k);
      var d = Number(item.precoDe).toFixed(2).split('.');
      var dBase = y+50*k;
      // o bloco "DE" também encolhe se for esbarrar na caixa vermelha
      var medirDe = function(cd){
        setCap(doc,'Ant',cd*0.478); var a=doc.getTextWidth('R$');
        setCap(doc,'Ant',cd);       var b=doc.getTextWidth(d[0]);
        setCap(doc,'Ant',cd*0.478); var c=doc.getTextWidth(','+d[1]);
        setF(doc,'PopS',emParaCap(cd*0.26)); var e=doc.getTextWidth('unid.');
        return {rs:a, int:b, total:a+cd*0.13+b+Math.max(c,e)};
      };
      var dispDe = (bx - dx) - 3*k;
      var capDe = 11.5*k*Math.min(1, dispDe/medirDe(11.5*k).total);
      var md = medirDe(capDe);
      setCap(doc,'Ant',capDe*0.478);
      doc.text('R$', dx, dBase);
      setCap(doc,'Ant',capDe);
      doc.text(d[0], dx+md.rs+capDe*0.13, dBase);
      var dCx = dx+md.rs+capDe*0.13+md.int;
      setCap(doc,'Ant',capDe*0.478); doc.text(','+d[1], dCx, dBase-capDe*0.52);
      setF(doc,'PopS',emParaCap(capDe*0.26)); doc.text('unid.', dCx, dBase);
    }

    // ---- rodapé ----
    var fx = cx+cw*0.045;
    if(item.validade){
      doc.setTextColor(PDF_RED[0],PDF_RED[1],PDF_RED[2]);
      setF(doc,'PopB',emParaCap(2.9*k));
      doc.text('Validade: '+fmtDate(item.validade).replace(/\/(\d{2})(\d{2})$/,'/$2'), fx, y+87*k);
    }

    // logo Oriundi (imagem real embutida no app)
    var logoH = 9*k, logoW = logoH*2.295, logoX = x+w-pad-logoW;
    try{ if(LOGO_SRC) doc.addImage(LOGO_SRC,'PNG',logoX,y+h-pad-logoH-1*k,logoW,logoH); }catch(e){}

    doc.setTextColor(PDF_INK[0],PDF_INK[1],PDF_INK[2]);
    setF(doc,'PopS',emParaCap(2.6*k)); var la = doc.getTextWidth('Siga nossas');
    doc.text('Siga nossas', fx, y+93.5*k);
    setF(doc,'PopB',emParaCap(2.6*k)); var lb = doc.getTextWidth('REDES SOCIAIS!');
    doc.text('REDES SOCIAIS!', fx, y+98*k);
    var labelW = Math.max(la,lb);

    var redes = [
      {ic:[icFacebook,icInstagram], txt:'@oriundi.supermercados'},
      {ic:[icYoutube],              txt:'@oriundisupermercados'}
    ];
    var rIni = fx+labelW+4*k, rFim = logoX-4*k;
    var medirRedes = function(e){
      var s = 6*k*e, tot = 0;
      setF(doc,'PopB',emParaCap(3*k*e));
      redes.forEach(function(r){
        r.ic.forEach(function(f){ tot += (f===icYoutube ? s*1.40 : s) + s*0.14; });
        tot += s*0.16 + doc.getTextWidth(r.txt) + s*0.60;
      });
      return {s:s, total:tot};
    };
    var escR = Math.min(1, (rFim-rIni)/medirRedes(1).total);
    var mr = medirRedes(escR);
    var cur = rIni, sIc = mr.s, icY = y+95.8*k - sIc*0.78;
    redes.forEach(function(r){
      r.ic.forEach(function(f){
        f(doc, cur, icY, sIc);
        cur += (f===icYoutube ? sIc*1.40 : sIc) + sIc*0.14;
      });
      cur += sIc*0.16;
      doc.setTextColor(PDF_INK[0],PDF_INK[1],PDF_INK[2]);
      setF(doc,'PopB',emParaCap(3*k*escR));
      doc.text(r.txt, cur, y+95.8*k);
      cur += doc.getTextWidth(r.txt) + sIc*0.60;
    });
  }

  function novoDocPlacasPDF_(formato){
    var JsPdfCtor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : null;
    if(!JsPdfCtor){
      aviso('O gerador de PDF não carregou. Confira a conexão e tente de novo.', 'erro');
      return null;
    }
    var doc = formato === 'placa'
      ? new JsPdfCtor({ unit:'mm', format:[205,102], orientation:'landscape' })
      : new JsPdfCtor({ unit:'mm', format:'a4', orientation:'portrait' });
    registrarFontesPDF_(doc);
    return doc;
  }

  /* ---------- placa de fidelidade "Meu Oriundi" ----------
     Segunda variante de placa, para ofertas exclusivas de clientes
     cadastrados no programa. Layout aprovado com o time de marketing
     (triângulo decorativo vermelho, selo Meu Oriundi, bloco verde de
     instrução). Selecionada automaticamente quando item.fidelidade
     é verdadeiro. */
  var COR_VERM_FID = [243, 47, 44];
  var COR_VERDE_FID = [0, 143, 62];

  function desenharSeloMeuOriundi_(doc,x,y,w,h){
    doc.setDrawColor(COR_VERM_FID[0],COR_VERM_FID[1],COR_VERM_FID[2]);
    doc.setLineWidth(h*0.05);
    doc.setFillColor(255,255,255);
    doc.roundedRect(x,y,w,h,h/2,h/2,'FD');
    setCap(doc,'PopS', h*0.34);
    doc.setTextColor(COR_VERDE_FID[0],COR_VERDE_FID[1],COR_VERDE_FID[2]);
    doc.text('Meu', x+w*0.50, y+h*0.44, {align:'center'});
    setCap(doc,'Ant', h*0.40);
    doc.setTextColor(COR_VERM_FID[0],COR_VERM_FID[1],COR_VERM_FID[2]);
    doc.text('ORIUNDI', x+w*0.50, y+h*0.84, {align:'center'});
  }

  function desenharPlacaFidelidadePDF_(doc, item, x, y, w, h){
    var k = h/102;
    doc.setFillColor(255,255,255); doc.rect(x,y,w,h,'F');
    doc.setDrawColor(215,215,215); doc.setLineWidth(.2); doc.rect(x,y,w,h);

    // triângulo decorativo vermelho, canto superior direito
    doc.setFillColor(COR_VERM_FID[0],COR_VERM_FID[1],COR_VERM_FID[2]);
    doc.triangle(x+w*0.638,y, x+w,y, x+w,y+h*0.349, 'F');

    var pad = 4*k, colW = w*0.60-pad;
    doc.setTextColor(PDF_INK[0],PDF_INK[1],PDF_INK[2]);
    var nomeTxt = String(item.nome||'').toUpperCase();
    setCap(doc,'Ant',10*k);
    var ls = doc.splitTextToSize(nomeTxt,colW);
    if(ls.length===1){
      doc.text(ls[0], x+pad, y+15.8*k);
    } else {
      doc.text(ls[0], x+pad, y+15.8*k);
      var resto = nomeTxt.substring(ls[0].length).trim();
      // a segunda linha também respeita a coluna, senão invade o triângulo
      var cap2=6.5*k, capMin2=3.2*k;
      while(cap2>capMin2){
        setCap(doc,'Ant',cap2);
        if(doc.splitTextToSize(resto,colW).length<=1) break;
        cap2 -= 6.5*k*0.05;
      }
      setCap(doc,'Ant',cap2);
      doc.text(doc.splitTextToSize(resto,colW)[0], x+pad, y+24*k);
    }

    // DE: preço antigo + validade da campanha
    var deY = y+40*k;
    setCap(doc,'Ant',5*k); doc.text('DE:', x+pad, deY);
    if(item.precoDe){
      var dTxt = fmtMoney(item.precoDe).replace('R$ ','');
      setCap(doc,'PopS',5*k); var drs = doc.getTextWidth('R$');
      doc.text('R$', x+pad+9*k, deY);
      setCap(doc,'Ant',8*k); doc.text(dTxt, x+pad+9*k+drs+1.5*k, deY);
    }
    if(item.validade){
      setCap(doc,'PopS',3.6*k); doc.setTextColor(80,80,80);
      doc.text('Oferta válida até: '+fmtDate(item.validade), x+w*0.60, deY, {align:'right'});
      doc.setTextColor(PDF_INK[0],PDF_INK[1],PDF_INK[2]);
    }

    // caixa vermelha do preço POR (mesma lógica de auto-ajuste por dígitos)
    var bx=x+w*0.014, by=y+h*0.466, bw=w*0.570, bh=h*0.454;
    doc.setFillColor(COR_VERM_FID[0],COR_VERM_FID[1],COR_VERM_FID[2]);
    doc.roundedRect(bx,by,bw,bh,4*k,4*k,'F');
    doc.setTextColor(255,255,255); setCap(doc,'Ant',6*k);
    doc.text('POR:', bx+bw*0.05, by+bh*0.22);
    var p = Number(item.precoPor||0).toFixed(2).split('.'), nd = p[0].length;
    var fdig = nd<=1?1.25:(nd===2?1.10:(nd===3?.95:.78)), cb = 30*k*fdig;
    var med = function(cd){
      setCap(doc,'Ant',cd*.294); var a=doc.getTextWidth('R$');
      setCap(doc,'Ant',cd);      var b=doc.getTextWidth(p[0]);
      setCap(doc,'Ant',cd*.353); var c=doc.getTextWidth(','+p[1]);
      setCap(doc,'Ant',cd*.191); var e=doc.getTextWidth('UNID.');
      return {rs:a, int:b, total:a+cd*.06+b+cd*.06+Math.max(c,e)};
    };
    var cd = cb*Math.min(1,(bw*0.82)/med(cb).total,(bh*0.70)/cb), m=med(cd);
    var gx=bx+bw*0.05, gb=by+bh*0.86;
    setCap(doc,'Ant',cd*.294); doc.text('R$',gx,gb-cd*.26);
    setCap(doc,'Ant',cd); doc.text(p[0],gx+m.rs+cd*.06,gb);
    var cX = gx+m.rs+cd*.06+m.int+cd*.06;
    setCap(doc,'Ant',cd*.353); doc.text(','+p[1],cX,gb-cd*.66);
    setCap(doc,'Ant',cd*.191); doc.text('UNID.',cX,gb-cd*.06);

    // código de barras
    setCap(doc,'PopS',3*k); doc.setTextColor(PDF_INK[0],PDF_INK[1],PDF_INK[2]);
    doc.text('CÓD. BARRAS: '+(item.barcode||''), x+pad, y+h*0.955);

    // selo Meu Oriundi + bloco verde de instrução
    var sx=x+w*0.635, sy=y+h*0.255, sw=w*0.355, sh=h*0.365;
    desenharSeloMeuOriundi_(doc, sx, sy, sw, sh);

    var gy=sy+sh+h*0.03, gh=h*0.20;
    doc.setFillColor(COR_VERDE_FID[0],COR_VERDE_FID[1],COR_VERDE_FID[2]);
    doc.roundedRect(sx,gy,sw,gh,3*k,3*k,'F');
    doc.setDrawColor(255,255,255); doc.setLineWidth(k*0.3);
    doc.line(sx+sw*0.50, gy+gh*0.20, sx+sw*0.50, gy+gh*0.80);
    doc.setTextColor(255,255,255); setCap(doc,'PopS',2.9*k);
    var l1 = doc.splitTextToSize('OFERTA EXCLUSIVA PARA CLIENTES MEU ORIUNDI!', sw*0.44);
    var yy=gy+gh*0.30; l1.forEach(function(l){ doc.text(l, sx+sw*0.25, yy, {align:'center'}); yy+=3.2*k; });
    var l2 = doc.splitTextToSize('CADASTRE-SE E TENHA DESCONTOS EXCLUSIVOS!!', sw*0.44);
    yy=gy+gh*0.30; l2.forEach(function(l){ doc.text(l, sx+sw*0.75, yy, {align:'center'}); yy+=3.2*k; });

    // instrução final (quebra dentro da coluna direita)
    setCap(doc,'PopB',3.0*k); doc.setTextColor(PDF_INK[0],PDF_INK[1],PDF_INK[2]);
    var rf = doc.splitTextToSize('INFORME-SE NA RECEPÇÃO OU NO GUARDA-VOLUMES!', sw);
    var ry=y+h*0.93;
    rf.slice(0,2).forEach(function(l){ doc.text(l, sx, ry); ry+=3.6*k; });
  }

  /* Escolhe a variante certa conforme o tipo da placa. */
  function desenharPlacaAny_(doc, item, x, y, w, h){
    if(item.fidelidade) desenharPlacaFidelidadePDF_(doc, item, x, y, w, h);
    else desenharPlacaPDF_(doc, item, x, y, w, h);
  }

  function montarPaginasPlacasPDF_(doc, itens){
    var TAG_W = 205, TAG_H = 102;          // tamanho real da placa, em mm
    var x = (210 - TAG_W)/2, topo = 22, gap = 12;
    for(var i=0;i<itens.length;i+=2){
      if(i>0) doc.addPage();
      desenharPlacaAny_(doc, itens[i], x, topo, TAG_W, TAG_H);
      doc.setDrawColor(180,180,180);
      doc.setLineDashPattern([1.5,1.5], 0);
      doc.line(x, topo+TAG_H+gap/2, x+TAG_W, topo+TAG_H+gap/2);
      doc.setLineDashPattern([], 0);
      if(itens[i+1]){
        desenharPlacaAny_(doc, itens[i+1], x, topo+TAG_H+gap, TAG_W, TAG_H);
      }
    }
  }



  /* ---------- pré-visualização antes de baixar ----------
     O PDF é montado em memória e exibido num quadro, com a descrição
     editável. Nada é baixado até a pessoa confirmar. O preço é decisão
     do comprador: o marketing vê, mas não altera. */
  var previewItens = [];
  var previewIdx = 0;

  function itemParaPreview_(i){
    return { id:i.id, nome:(i.nomePlaca || i.nome || ''), nomeOriginal:i.nome, nomePlacaOriginal:i.nomePlaca || '',
             barcode:i.barcode, codigoInterno:i.codigoInterno, status:i.status,
             precoDe:i.precoDe, precoPor:i.precoPor, infoPlaca:i.infoPlaca,
             validade:i.validade || '', fidelidade:!!i.fidelidade };
  }

  function abrirPreviaPlaca(id){
    var item = itemsPlaca.filter(function(i){ return i.id === id; })[0];
    if(!item) return;
    previewItens = [itemParaPreview_(item)];
    previewIdx = 0;
    renderPreviaModal();
  }

  function idsSelecionadosVisiveis(){
    var visiveis = listaPlacasFiltrada().map(function(i){ return i.id; });
    return visiveis.filter(function(id){ return placaSelecionadas[id]; });
  }

  function abrirPreviaSelecionadas(){
    var ids = idsSelecionadosVisiveis();
    var itens = listaPlacasFiltrada().filter(function(i){ return ids.indexOf(i.id) !== -1; });
    if(!itens.length){ aviso('Selecione ao menos uma placa.', 'erro'); return; }
    previewItens = itens.map(itemParaPreview_);
    previewIdx = 0;
    renderPreviaModal();
  }

  function renderPreviaModal(){
    var n = previewItens.length;
    var it = previewItens[previewIdx];
    if(!it) return;
    var podePreco = role === 'comprador';
    var nav = n > 1
      ? '<div class="prev-nav">' +
          '<button type="button" class="btn btn-outline btn-sm" ' + (previewIdx === 0 ? 'disabled' : '') + ' onclick="App.previaAnterior()">‹ Anterior</button>' +
          '<span class="prev-pos">Placa ' + (previewIdx+1) + ' de ' + n + '</span>' +
          '<button type="button" class="btn btn-outline btn-sm" ' + (previewIdx === n-1 ? 'disabled' : '') + ' onclick="App.previaProxima()">Próxima ›</button>' +
        '</div>'
      : '';
    var precos = podePreco
      ? '<div class="row2">' +
          campoPreco('prev-de', 'Preço De (opcional)', it.precoDe, 'oninput="App.previaAtualiza()"') +
          campoPreco('prev-por', 'Preço Por', it.precoPor, 'oninput="App.previaAtualiza()"') +
        '</div><p class="desconto" id="prev-desc" aria-live="polite"></p>'
      : '<div class="preco-fixo"><span class="lbl" style="margin:0">Preço definido pelo comprador</span>' + precoHtml(it.precoDe, it.precoPor, it.infoPlaca) +
          '<p class="hint">Se o preço estiver errado, peça a correção ao comprador antes de imprimir.</p></div>';
    showModal(
      cabecalhoModal('Conferir antes de imprimir') +
      nav +
      '<div class="prev-frame"><iframe id="prev-iframe" title="Pré-visualização da placa"></iframe></div>' +
      '<div class="prev-sub"><span class="tag ' + (it.fidelidade ? 'tag-fid' : 'tag-neutro') + '">' + (it.fidelidade ? 'Placa Meu Oriundi' : 'Placa de oferta') + '</span>' +
        '<button type="button" class="btn-link" onclick="App.previaTelaCheia()">Abrir em tela cheia</button></div>' +
      '<div class="field"><label for="prev-nome">Descrição que sai na placa</label>' +
        '<textarea id="prev-nome" rows="2" oninput="App.previaAtualiza()">' + esc(it.nome) + '</textarea>' +
        '<p class="hint" id="prev-dica"></p>' +
      '</div>' +
      precos +
      '<div id="prev-erro"></div>' +
      '<button type="button" class="btn btn-primary btn-block" onclick="App.baixarPreviaPDF()">Baixar PDF' + (n > 1 ? ' (' + n + ' placas)' : '') + '</button>' +
      '<p class="hint auth-centro">Mudanças na descrição' + (podePreco ? ' e no preço' : '') + ' ficam salvas para as próximas impressões.</p>'
    );
    atualizarPreviaIframe();
    if(podePreco) atualizarDesconto('prev-de', 'prev-por', 'prev-desc');
  }

  function previaAnterior(){ if(previewIdx > 0){ capturarCamposPrevia(); previewIdx--; renderPreviaModal(); } }
  function previaProxima(){ if(previewIdx < previewItens.length-1){ capturarCamposPrevia(); previewIdx++; renderPreviaModal(); } }

  function capturarCamposPrevia(){
    var it = previewItens[previewIdx];
    if(!it) return;
    var n = el('prev-nome');
    if(n) it.nome = n.value;
    if(role === 'comprador'){
      var de = el('prev-de'), po = el('prev-por');
      if(de) it.precoDe = de.value.trim() ? parseMoney(de.value) : '';
      if(po) it.precoPor = po.value.trim() ? parseMoney(po.value) : '';
    }
  }

  var previaTimer = null;
  function previaAtualiza(){
    capturarCamposPrevia();
    if(role === 'comprador') atualizarDesconto('prev-de', 'prev-por', 'prev-desc');
    if(previaTimer) clearTimeout(previaTimer);
    previaTimer = setTimeout(atualizarPreviaIframe, 350);
  }

  function docDaPlacaAtual(){
    var it = previewItens[previewIdx];
    var doc = novoDocPlacasPDF_('placa');
    if(!doc || !it) return null;
    desenharPlacaAny_(doc, {
      nome:it.nome, barcode:it.barcode, codigoInterno:it.codigoInterno,
      precoDe:(Number(it.precoDe) > 0 ? it.precoDe : ''), precoPor:(Number(it.precoPor) > 0 ? it.precoPor : ''),
      infoPlaca:it.infoPlaca, validade:it.validade, fidelidade:it.fidelidade
    }, 0, 0, 205, 102);
    return doc;
  }

  function atualizarPreviaIframe(){
    var frame = el('prev-iframe');
    if(!frame) return;
    var doc = docDaPlacaAtual();
    if(doc){ try{ frame.src = doc.output('datauristring') + '#toolbar=0&navpanes=0&view=FitH'; }catch(e){} }
    var dica = el('prev-dica');
    var it = previewItens[previewIdx];
    if(dica && it){
      var t = String(it.nome || '');
      dica.textContent = t.length + ' caracteres' + (t.length > 46 ? '. Textos longos ficam menores na placa.' : '.');
    }
  }

  function previaTelaCheia(){
    capturarCamposPrevia();
    var doc = docDaPlacaAtual();
    if(!doc) return;
    try{
      var url = doc.output('bloburl');
      var w = window.open(url, '_blank');
      if(!w) aviso('O navegador bloqueou a nova aba. Permita pop-ups para o Giro.', 'erro');
    }catch(e){ aviso('Não foi possível abrir a prévia.', 'erro'); }
  }

  function baixarPreviaPDF(){
    capturarCamposPrevia();
    // confere preços antes de gerar
    for(var i=0;i<previewItens.length;i++){
      var p = previewItens[i];
      var msg = '';
      if(!(Number(p.precoPor) > 0)) msg = 'Falta o preço Por desta placa.';
      else if(Number(p.precoDe) > 0 && Number(p.precoDe) <= Number(p.precoPor)) msg = 'O preço De precisa ser maior que o Por.';
      else if(!String(p.nome || '').trim()) msg = 'A descrição da placa está vazia.';
      if(msg){
        if(i !== previewIdx){ previewIdx = i; renderPreviaModal(); }
        var box = el('prev-erro');
        if(box) box.innerHTML = '<div class="warn-box" role="alert" style="margin-bottom:12px">' + esc(msg) + (role === 'comprador' ? '' : ' Peça a correção ao comprador.') + '</div>';
        return;
      }
    }

    // guarda as edições para as próximas impressões
    var mudadas = [];
    previewItens.forEach(function(pi){
      var orig = itemsPlaca.filter(function(i){ return i.id === pi.id; })[0];
      if(!orig) return;
      var campos = [];
      var nomeNovo = String(pi.nome || '').trim();
      var nomeAtual = orig.nomePlaca || orig.nome;
      if(nomeNovo && nomeNovo !== nomeAtual){ orig.nomePlaca = (nomeNovo === orig.nome ? '' : nomeNovo); campos.push('nomePlaca'); }
      if(role === 'comprador'){
        if(Number(pi.precoDe || 0) !== Number(orig.precoDe || 0)){ orig.precoDe = pi.precoDe; campos.push('precoDe'); }
        if(Number(pi.precoPor || 0) !== Number(orig.precoPor || 0)){ orig.precoPor = pi.precoPor; campos.push('precoPor'); }
      }
      if(campos.length) mudadas.push({ item:orig, campos:campos });
    });
    mudadas.forEach(function(m){ salvarItem('itensPlaca', m.item, m.campos); });

    var doc = novoDocPlacasPDF_();
    if(!doc) return;
    montarPaginasPlacasPDF_(doc, previewItens.map(function(i){
      return { nome:i.nome, barcode:i.barcode, codigoInterno:i.codigoInterno,
               precoDe:(Number(i.precoDe) > 0 ? i.precoDe : ''), precoPor:i.precoPor, infoPlaca:i.infoPlaca, validade:i.validade,
               fidelidade:i.fidelidade };
    }));
    var nome = previewItens.length === 1
      ? 'placa-' + (previewItens[0].codigoInterno || previewItens[0].barcode || 'oriundi') + '.pdf'
      : 'placas-oriundi-' + nowIso().slice(0,10) + '.pdf';
    doc.save(nome);

    var pendentes = role === 'marketing'
      ? previewItens.filter(function(i){ return i.status === 'pendente'; }).map(function(i){ return i.id; })
      : [];
    placaSelecionadas = {};
    closeModal();
    render();
    if(pendentes.length){
      dialogo({
        titulo: pendentes.length === 1 ? 'Marcar a placa como feita?' : 'Marcar as ' + pendentes.length + ' placas como feitas?',
        texto:'Depois de imprimir, marque para o abastecimento saber que já pode colocar na seção.',
        confirmar:'Marcar como feita' + (pendentes.length === 1 ? '' : 's'),
        cancelar:'Agora não',
        onConfirmar:function(){ marcarFeitas(pendentes); }
      });
    }
  }

  /* ---------- situação de cada item, com o nome dizendo quem age ---------- */
  var STATUS = {
    expo:   { pendente:['Aguardando abastecimento','aguardando'], estoque:['Aguardando estoque','aguardando'],
              resolvido:['Na seção','concluido'], sem_estoque:['Sem estoque','urgente'] },
    val:    { aguardando:['Aguardando comprador','aguardando'], rebaixado:['Rebaixado','concluido'] },
    placas: { pendente:['Aguardando marketing','aguardando'], pronta:['Aguardando abastecimento','aguardando'],
              estoque:['Aguardando estoque','aguardando'], confirmado:['Na seção','concluido'], sem_estoque:['Sem estoque','urgente'] }
  };
  var FILTROS = {
    expo:    [['pendente','Aguardando abastecimento'],['estoque','Aguardando estoque'],['resolvido','Na seção'],['sem_estoque','Sem estoque'],['todos','Todos']],
    val:     [['aguardando','Aguardando comprador'],['rebaixado','Rebaixado'],['todos','Todos']],
    placas:  [['pendente','Aguardando marketing'],['pronta','Aguardando abastecimento'],['estoque','Aguardando estoque'],['confirmado','Na seção'],['sem_estoque','Sem estoque'],['todos','Todos']],
    estoque: [['aguardando','Para conferir'],['conferidos','Conferidos'],['todos','Todos']]
  };
  var TAB_LABEL = { expo:'Exposição', val:'Validade', placas:'Placas', estoque:'Conferência' };
  var RESULTADO_LABEL = { loja:'Estava na loja', deposito:'Veio do depósito' };

  function contaStatus(arr, st){ return arr.filter(function(i){ return i.status === st; }).length; }

  /* acao: itens que dependem de quem está logado; aberto: tudo em andamento */
  function contagensAba(t, fil){
    fil = fil || activeFilial;
    if(t === 'expo'){
      var ex = daFilial(itemsExpo, fil);
      var pend = contaStatus(ex, 'pendente'), est = contaStatus(ex, 'estoque');
      return { acao: role === 'loja' ? pend : 0, aberto: pend + est, urgente: 0 };
    }
    if(t === 'val'){
      var ag = daFilial(itemsVal, fil).filter(function(i){ return i.status === 'aguardando'; });
      var urg = ag.filter(function(i){ return daysUntil(i.validade) <= 3; }).length;
      return { acao: role === 'comprador' ? ag.length : 0, aberto: ag.length, urgente: urg };
    }
    if(t === 'estoque'){
      var n = contaStatus(daFilial(itemsExpo, fil), 'estoque') + contaStatus(daFilial(itemsPlaca, fil), 'estoque');
      return { acao: role === 'estoque' ? n : 0, aberto: n, urgente: 0 };
    }
    var pl = daFilial(itemsPlaca, fil);
    var p1 = contaStatus(pl, 'pendente'), p2 = contaStatus(pl, 'pronta'), p3 = contaStatus(pl, 'estoque');
    return { acao: role === 'marketing' ? p1 : (role === 'loja' ? p2 : 0), aberto: p1 + p2 + p3, urgente: 0 };
  }

  /* ---------- avisos de item novo ----------
     A cada atualização, compara o que depende da pessoa com o que já
     existia. Item novo: aviso na tela, vibração no celular, contagem no
     título da aba e, se ativado, alerta do navegador. */
  var novidadesConhecidas = null;

  function idsAcionaveis(){
    if(!currentUser) return [];
    var f = activeFilial, ids = [];
    function junta(arr, st, prefixo){ daFilial(arr, f).forEach(function(i){ if(i.status === st) ids.push(prefixo + i.id); }); }
    if(role === 'loja'){ junta(itemsExpo, 'pendente', 'e'); junta(itemsPlaca, 'pronta', 'p'); }
    else if(role === 'estoque'){ junta(itemsExpo, 'estoque', 'e'); junta(itemsPlaca, 'estoque', 'p'); }
    else if(role === 'marketing'){ junta(itemsPlaca, 'pendente', 'p'); }
    else if(role === 'comprador'){ junta(itemsVal, 'aguardando', 'v'); }
    return ids;
  }

  function atualizarTitulo(){
    var n = currentUser ? idsAcionaveis().length : 0;
    document.title = (n ? '(' + n + ') ' : '') + 'Giro';
  }

  function verificarNovidades(avisar){
    var atuais = idsAcionaveis();
    if(avisar && novidadesConhecidas){
      var novos = atuais.filter(function(id){ return novidadesConhecidas.indexOf(id) === -1; });
      if(novos.length){
        var txt = role === 'estoque'
          ? (novos.length === 1 ? 'Novo produto para conferir no estoque.' : novos.length + ' novos produtos para conferir no estoque.')
          : (novos.length === 1 ? 'Chegou 1 item novo para você.' : 'Chegaram ' + novos.length + ' itens novos para você.');
        aviso(txt);
        try{ if(navigator.vibrate) navigator.vibrate([120, 80, 120]); }catch(e){}
        if(document.hidden && alertasDoNavegador()){
          try{ new Notification('Giro', { body:txt, tag:'giro-novidades' }); }catch(e){ /* celular: só o aviso na tela */ }
        }
      }
    }
    novidadesConhecidas = atuais;
    atualizarTitulo();
  }

  /* ---------- desenho da tela ---------- */
  function render(){
    if(renderGate()){ renderSelBar(); atualizarTitulo(); return; }
    renderConta();
    renderFilialBar();
    renderTabs();
    renderNotices();
    renderMain();
    renderSelBar();
    atualizarTitulo();
  }

  function renderFilialBar(){
    var box = el('filialBar');
    if(!box) return;
    if(!currentUser || !isComprador()){ box.innerHTML = ''; return; }
    box.innerHTML = '<div class="filial-seg" role="radiogroup" aria-label="Filial">' + FILIAIS.map(function(f){
      var c = contagensAba('val', f.id);
      var on = activeFilial === f.id;
      return '<button type="button" role="radio" aria-checked="' + on + '" onclick="App.setActiveFilial(\'' + f.id + '\')">' +
        esc(f.curto) +
        (c.aberto ? '<span class="seg-n">' + c.aberto + '</span><span class="sr"> ' + plural(c.aberto, 'aguardando rebaixa', 'aguardando rebaixa') + '</span>' : '') +
        (c.urgente ? '<span class="dot" aria-hidden="true"></span><span class="sr">, ' + plural(c.urgente, 'vence', 'vencem') + ' em até 3 dias</span>' : '') +
      '</button>';
    }).join('') + '</div>';
  }

  function renderTabs(){
    var box = el('tabs');
    box.innerHTML = visibleTabsFor(role).map(function(t){
      var c = contagensAba(t);
      var on = activeTab === t;
      var badge = '';
      if(c.acao > 0) badge = '<span class="tab-n acao" aria-hidden="true">' + c.acao + '</span><span class="sr">, ' + c.acao + ' aguardando você</span>';
      else if(c.aberto > 0) badge = '<span class="tab-n" aria-hidden="true">' + c.aberto + '</span><span class="sr">, ' + c.aberto + ' em aberto</span>';
      var dot = (c.urgente && role !== 'marketing') ? '<span class="dot" aria-hidden="true"></span><span class="sr">, vencendo em até 3 dias</span>' : '';
      return '<button type="button" class="tab-btn" role="tab" aria-selected="' + on + '" onclick="App.setTab(\'' + t + '\')">' + TAB_LABEL[t] + badge + dot + '</button>';
    }).join('');
  }

  function semEstoqueRecentes(arr){
    var limite = Date.now() - 7*86400000;
    return arr.filter(inActiveFilial).filter(function(i){ return i.status === 'sem_estoque' && ts(i.verificadoEm) >= limite; }).length;
  }

  function renderNotices(){
    var box = el('notices');
    if(!box) return;
    if(!currentUser){ box.innerHTML = ''; return; }
    var html = '';
    if(fila.length && envioFalhou){
      html += '<div class="notice notice-info" role="status"><span class="txt">' +
        (fila.length === 1 ? '1 alteração ainda não chegou à planilha. Ela está guardada neste aparelho' : fila.length + ' alterações ainda não chegaram à planilha. Elas estão guardadas neste aparelho') +
        ' e o Giro tenta enviar de novo sozinho.</span>' +
        '<button type="button" class="btn btn-outline btn-sm" onclick="App.enviarAgora()">Tentar agora</button></div>';
    }
    if(isComprador() && backendVersao < SCRIPT_VERSAO_MIN){
      html += '<div class="notice notice-urgente" role="status"><span class="txt">O script da planilha está desatualizado. Atualize o Apps Script para a conferência de estoque funcionar.</span></div>';
    }
    if(isComprador()){
      var semFilial = itemsExpo.filter(function(i){ return !i.filial; }).length +
                      itemsVal.filter(function(i){ return !i.filial; }).length +
                      itemsPlaca.filter(function(i){ return !i.filial; }).length;
      if(semFilial){
        html += '<div class="notice notice-info"><span class="txt">' + plural(semFilial, 'item foi registrado', 'itens foram registrados') + ' antes da separação por filial e ' + (semFilial === 1 ? 'aparece' : 'aparecem') + ' nas duas lojas até ' + (semFilial === 1 ? 'ser concluído' : 'serem concluídos') + '.</span></div>';
      }
      var tabSem = activeTab === 'expo' ? 'expo' : (activeTab === 'placas' ? 'placas' : '');
      var nSem = tabSem ? semEstoqueRecentes(tabSem === 'expo' ? itemsExpo : itemsPlaca) : 0;
      if(nSem && filtros[tabSem] !== 'sem_estoque'){
        html += '<div class="notice notice-urgente" role="status"><span class="txt">' +
          (nSem === 1 ? 'A conferência confirmou 1 produto sem estoque nos últimos 7 dias.' : 'A conferência confirmou ' + nSem + ' produtos sem estoque nos últimos 7 dias.') +
          '</span><button type="button" class="btn btn-outline btn-sm" onclick="App.setFiltro(\'' + tabSem + '\',\'sem_estoque\')">Ver</button></div>';
      }
    }
    if(activeTab === 'val' && (role === 'comprador' || role === 'loja')){
      var urg = contagensAba('val').urgente;
      if(urg){
        html += '<div class="notice notice-urgente" role="status"><span class="txt">' +
          (role === 'comprador'
            ? (urg === 1 ? '1 item vence em até 3 dias e aguarda sua rebaixa. Ele está no topo da lista.' : urg + ' itens vencem em até 3 dias e aguardam sua rebaixa. Eles estão no topo da lista.')
            : (urg === 1 ? '1 item reportado vence em até 3 dias e ainda aguarda o comprador.' : urg + ' itens reportados vencem em até 3 dias e ainda aguardam o comprador.')) +
          '</span></div>';
      }
    }
    box.innerHTML = html;
  }

  function chipsHtml(tab, base, contar){
    var cont = contar || function(st){ return st === 'todos' ? base.length : base.filter(function(i){ return i.status === st; }).length; };
    return '<div class="filtros" role="group" aria-label="Filtrar por situação">' + FILTROS[tab].map(function(f){
      var on = filtros[tab] === f[0];
      return '<button type="button" class="chip" aria-pressed="' + on + '" onclick="App.setFiltro(\'' + tab + '\',\'' + f[0] + '\')">' + f[1] + ' <span class="chip-n">' + cont(f[0]) + '</span></button>';
    }).join('') + '</div>';
  }

  function filtrar(base, f){
    if(f === 'todos') return base.slice();
    return base.filter(function(i){ return i.status === f; });
  }

  /* Em aberto: mais antigo primeiro (ninguém fica esquecido).
     Concluídos: mais recente primeiro. */
  var RANK_EXPO = { pendente:0, estoque:1, resolvido:2, sem_estoque:2 };
  function fimExpo(i){ return i.status === 'sem_estoque' ? i.verificadoEm : i.resolvidoEm; }
  function ordemExpo(a, b){
    var ra = RANK_EXPO[a.status] || 0, rb = RANK_EXPO[b.status] || 0;
    if(ra !== rb) return ra - rb;
    if(ra === 0) return ts(a.criadoEm) - ts(b.criadoEm);
    if(ra === 1) return ts(a.enviadoEstoqueEm) - ts(b.enviadoEstoqueEm);
    return ts(fimExpo(b)) - ts(fimExpo(a));
  }
  function ordemVal(a, b){
    var ra = a.status === 'aguardando' ? 0 : 1, rb = b.status === 'aguardando' ? 0 : 1;
    if(ra !== rb) return ra - rb;
    if(ra === 0) return daysUntil(a.validade) - daysUntil(b.validade);
    return ts(b.rebaixadoEm) - ts(a.rebaixadoEm);
  }
  var RANK_PLACA = { pendente:0, pronta:1, estoque:2, confirmado:3, sem_estoque:3 };
  function fimPlaca(i){ return i.status === 'sem_estoque' ? i.verificadoEm : i.confirmadoEm; }
  function ordemPlaca(a, b){
    var ra = RANK_PLACA[a.status] || 0, rb = RANK_PLACA[b.status] || 0;
    if(ra !== rb) return ra - rb;
    if(ra === 0) return ts(a.criadoEm) - ts(b.criadoEm);
    if(ra === 1) return ts(a.prontaEm) - ts(b.prontaEm);
    if(ra === 2) return ts(a.enviadoEstoqueEm) - ts(b.enviadoEstoqueEm);
    return ts(fimPlaca(b)) - ts(fimPlaca(a));
  }

  function vazio(titulo, texto){
    return '<div class="empty"><h3>' + titulo + '</h3><p>' + texto + '</p></div>';
  }

  function renderMain(){
    var box = el('main');
    if(!currentUser){ box.innerHTML = ''; return; }
    if(visibleTabsFor(role).indexOf(activeTab) === -1) activeTab = visibleTabsFor(role)[0];
    if(activeTab === 'expo') box.innerHTML = renderExpoTab();
    else if(activeTab === 'val') box.innerHTML = renderValTab();
    else if(activeTab === 'estoque') box.innerHTML = renderEstoqueTab();
    else box.innerHTML = renderPlacaTab();
  }

  function precoHtml(de, por, info){
    if(!(Number(por) > 0)) return info ? '<div class="preco"><span class="preco-por">' + esc(info) + '</span></div>' : '';
    var pct = descontoPct(de, por);
    return '<div class="preco">' +
      (Number(de) > 0 ? '<span class="preco-de">De <s>' + fmtMoney(de) + '</s></span>' : '') +
      '<span class="preco-por"><span class="preco-lbl">Por</span>' + fmtMoney(por) + '</span>' +
      (pct ? '<span class="preco-off">−' + pct + '%</span>' : '') +
    '</div>';
  }

  /* Os três botões do abastecimento, iguais em exposição e placas. */
  function botoesAbastecimento(tabela, item){
    var id = item.id;
    return '<div class="abast" role="group" aria-label="Onde está o produto?">' +
      '<span class="abast-tit">Onde está o produto?</span>' +
      '<button type="button" class="btn btn-primary" onclick="App.confirmarAbastecimento(\'' + tabela + '\',\'' + id + '\',\'loja\')">Produto na loja</button>' +
      '<button type="button" class="btn btn-primary" onclick="App.confirmarAbastecimento(\'' + tabela + '\',\'' + id + '\',\'deposito\')">Encontrado no depósito</button>' +
      '<button type="button" class="btn btn-alerta" onclick="App.naoEncontrado(\'' + tabela + '\',\'' + id + '\')">Não encontrado: enviar ao estoque</button>' +
    '</div>';
  }

  /* Recado do estoque para o abastecimento (quando encontrou o produto). */
  function notaEstoque(item){
    if(item.verificacao !== 'encontrado' || item.status === 'estoque') return '';
    if(!(item.status === 'pendente' || item.status === 'pronta')) return '';
    return '<div class="nota"><b>O estoque encontrou o produto</b>' +
      (item.obsEstoque ? ': ' + esc(item.obsEstoque) : '.') +
      '<span>Conferido por ' + esc(item.verificadoPor || '—') + ' em ' + fmtDateTime(item.verificadoEm) + '</span></div>';
  }

  /* Linhas do histórico ligadas ao abastecimento e ao estoque. */
  function metaAbastEstoque(item, campoFim, porFim, verboFim){
    var m = '';
    if(item.enviadoEstoqueEm){
      m += '<div class="card-meta">Não encontrado por ' + esc(item.enviadoEstoquePor || '—') + ' em ' + fmtDateTime(item.enviadoEstoqueEm) +
        (item.obsAbastecimento ? '. Procurou em: ' + esc(item.obsAbastecimento) : '') + '</div>';
    }
    var temNota = item.verificacao === 'encontrado' && (item.status === 'pendente' || item.status === 'pronta');
    if(item.verificadoEm && !temNota){
      m += '<div class="card-meta">Conferido pelo estoque (' + esc(item.verificadoPor || '—') + ') em ' + fmtDateTime(item.verificadoEm) + ': ' +
        (item.verificacao === 'sem_estoque' ? '<b>sem estoque físico</b>' : 'produto encontrado') +
        (item.obsEstoque ? '. ' + esc(item.obsEstoque) : '') + '</div>';
    }
    if(item[campoFim]){
      m += '<div class="card-meta">' + verboFim + ' por ' + esc(item[porFim] || '—') + ' em ' + fmtDateTime(item[campoFim]) + '</div>';
    }
    return m;
  }

  /* ----- exposição ----- */
  function renderExpoTab(){
    var base = itemsExpo.filter(inActiveFilial);
    var html = '';
    if(role === 'comprador') html += '<div class="acoes"><button type="button" class="btn btn-primary" onclick="App.openNewExpoModal()">' + plusIcon() + 'Avisar item não exposto</button></div>';
    html += chipsHtml('expo', base);
    var lst = filtrar(base, filtros.expo).sort(ordemExpo);
    html += lst.length ? '<div class="card-list">' + lst.map(renderExpoCard).join('') + '</div>' : vazioExpo();
    return html;
  }
  function vazioExpo(){
    var f = filtros.expo;
    if(f === 'pendente'){
      return role === 'loja'
        ? vazio('Nada para expor', 'Quando o comprador avisar que um produto chegou e não está na seção, ele aparece aqui.')
        : vazio('Nada aguardando o abastecimento', 'Use "Avisar item não exposto" para pedir que o abastecimento coloque um produto na seção.');
    }
    if(f === 'estoque') return vazio('Nada na conferência de estoque', 'Produtos que o abastecimento não encontrar aparecem aqui até o estoque responder.');
    if(f === 'resolvido') return vazio('Nenhum item confirmado', 'Os itens que o abastecimento confirmar aparecem aqui.');
    if(f === 'sem_estoque') return vazio('Nenhum produto sem estoque', 'Quando o estoque confirmar que um produto não tem saldo físico, ele aparece aqui.');
    return vazio('Nenhum item registrado', 'Os avisos de itens não expostos desta filial aparecem aqui.');
  }
  function renderExpoCard(item){
    var st = STATUS.expo[item.status] || STATUS.expo.pendente;
    var tags = '<span class="tag tag-' + st[1] + '">' + st[0] + '</span>' +
      (item.status === 'resolvido' && RESULTADO_LABEL[item.resultado] ? '<span class="tag tag-neutro">' + RESULTADO_LABEL[item.resultado] + '</span>' : '');
    var acoes = '';
    if(role === 'loja' && item.status === 'pendente') acoes = botoesAbastecimento('itensExpo', item);
    else if(role === 'comprador' && (item.status === 'pendente' || item.status === 'estoque')) acoes = '<div class="card-actions"><button type="button" class="btn btn-ghost btn-sm" onclick="App.removeExpo(\'' + item.id + '\')">Cancelar aviso</button></div>';
    var meta = '<div class="card-meta">Avisado por ' + esc(item.criadoPor || '—') + ' em ' + fmtDateTime(item.criadoEm) + '</div>' +
      metaAbastEstoque(item, 'resolvidoEm', 'resolvidoPor', 'Confirmado');
    return '<article class="card st-' + st[1] + '">' +
      '<div class="card-status">' + tags + '</div>' +
      '<div class="card-info"><h3 class="card-name">' + esc(item.nome) + '</h3>' + cardCodigos(item) +
        (item.observacao ? '<p class="card-obs">' + esc(item.observacao) + '</p>' : '') +
      '</div>' +
      notaEstoque(item) + meta + acoes +
    '</article>';
  }

  /* ----- validade ----- */
  function renderValTab(){
    var base = itemsVal.filter(inActiveFilial);
    var html = '';
    if(role === 'loja') html += '<div class="acoes"><button type="button" class="btn btn-primary" onclick="App.openNewValModal()">' + plusIcon() + 'Reportar item perto do vencimento</button></div>';
    html += chipsHtml('val', base);
    var lst = filtrar(base, filtros.val).sort(ordemVal);
    html += lst.length ? '<div class="card-list">' + lst.map(renderValCard).join('') + '</div>' : vazioVal();
    return html;
  }
  function vazioVal(){
    var f = filtros.val;
    if(f === 'aguardando'){
      return role === 'comprador'
        ? vazio('Nada aguardando rebaixa', 'Quando o abastecimento reportar um item perto do vencimento, ele aparece aqui para você registrar a rebaixa.')
        : vazio('Nenhum item aguardando o comprador', 'Use "Reportar item perto do vencimento" para avisar o comprador.');
    }
    if(f === 'rebaixado') return vazio('Nenhuma rebaixa registrada', 'As rebaixas do comprador aparecem aqui, com o novo preço.');
    return vazio('Nenhum item reportado', 'Os itens perto do vencimento desta filial aparecem aqui.');
  }
  function renderValCard(item){
    var d = daysUntil(item.validade);
    var st = STATUS.val[item.status] || STATUS.val.aguardando;
    var classe = item.status === 'rebaixado' ? 'concluido' : (d <= 3 ? 'urgente' : 'aguardando');
    var tags = '<span class="tag tag-' + st[1] + '">' + st[0] + '</span>';
    if(item.status !== 'rebaixado') tags += '<span class="tag tag-' + (d <= 3 ? 'urgente' : (d <= 7 ? 'aguardando' : 'neutro')) + '">' + prazoTexto(d) + '</span>';
    var corpo = '';
    var meta = '<div class="card-meta">Validade <b>' + fmtDate(item.validade) + '</b>, cerca de ' + esc(item.quantidade) + ' un.</div>' +
      '<div class="card-meta">Reportado por ' + esc(item.reportadoPor || '—') + ' em ' + fmtDateTime(item.reportadoEm) + '</div>';
    if(item.status === 'rebaixado'){
      var placa = itemsPlaca.filter(function(p){ return p.origemId === item.id; })[0];
      corpo = '<div class="preco"><span class="preco-por"><span class="preco-lbl">Novo preço</span>' + fmtMoney(item.novoPreco) + '</span></div>' +
        (item.observacaoComprador ? '<p class="card-obs">' + esc(item.observacaoComprador) + '</p>' : '');
      meta += '<div class="card-meta">Rebaixado por ' + esc(item.rebaixadoPor || '—') + ' em ' + fmtDateTime(item.rebaixadoEm) + '</div>';
      if(placa && STATUS.placas[placa.status]) tags += '<span class="tag tag-neutro">Placa: ' + STATUS.placas[placa.status][0].toLowerCase() + '</span>';
    }
    var acts = '';
    if(role === 'comprador' && item.status === 'aguardando'){
      acts = '<div class="card-actions"><button type="button" class="btn btn-primary" onclick="App.openRebaixaModal(\'' + item.id + '\')">Registrar rebaixa</button></div>';
    }
    return '<article class="card st-' + classe + '">' +
      '<div class="card-status">' + tags + '</div>' +
      '<div class="card-info"><h3 class="card-name">' + esc(item.nome) + '</h3>' + cardCodigos(item) + corpo + '</div>' +
      meta + acts +
    '</article>';
  }

  /* ----- placas ----- */
  function listaPlacasFiltrada(){
    return filtrar(itemsPlaca.filter(inActiveFilial), filtros.placas).sort(ordemPlaca);
  }
  function renderPlacaTab(){
    var base = itemsPlaca.filter(inActiveFilial);
    var html = '';
    if(role === 'comprador'){
      html += '<div class="acoes">' +
        '<button type="button" class="btn btn-primary" onclick="App.openNewPlacaModal()">' + plusIcon() + 'Pedir placa</button>' +
        '<button type="button" class="btn btn-outline" onclick="App.abrirImportarPlacas()">Importar planilha</button>' +
      '</div>';
    }
    html += chipsHtml('placas', base);
    var lst = listaPlacasFiltrada();
    if(lst.length && podePDF()){
      var sel = lst.filter(function(i){ return placaSelecionadas[i.id]; }).length;
      html += '<label class="sel-todas"><input type="checkbox" class="check" onchange="App.toggleSelectAllPlacas(this.checked)"' + (sel && sel === lst.length ? ' checked' : '') + '> Selecionar ' + (lst.length === 1 ? 'esta placa' : 'as ' + lst.length + ' placas desta lista') + ' para imprimir</label>';
    }
    html += lst.length ? '<div class="card-list">' + lst.map(renderPlacaCard).join('') + '</div>' : vazioPlaca();
    return html;
  }
  function vazioPlaca(){
    var f = filtros.placas;
    if(f === 'pendente'){
      return role === 'marketing'
        ? vazio('Nenhuma placa para fazer', 'Os pedidos do comprador aparecem aqui, inclusive os gerados por rebaixa.')
        : vazio('Nada aguardando o marketing', 'Os pedidos de placa ainda não feitos aparecem aqui.');
    }
    if(f === 'pronta'){
      return role === 'loja'
        ? vazio('Nenhuma placa para colocar', 'Quando o marketing marcar uma placa como feita, ela aparece aqui para você confirmar onde está o produto.')
        : vazio('Nada aguardando o abastecimento', 'As placas já feitas e ainda não colocadas aparecem aqui.');
    }
    if(f === 'estoque') return vazio('Nada na conferência de estoque', 'Placas cujo produto o abastecimento não encontrou aparecem aqui até o estoque responder.');
    if(f === 'confirmado') return vazio('Nenhuma placa na seção', 'As placas que o abastecimento confirmar aparecem aqui.');
    if(f === 'sem_estoque') return vazio('Nenhum produto sem estoque', 'Quando o estoque confirmar que um produto não tem saldo físico, a placa aparece aqui.');
    return role === 'comprador'
      ? vazio('Nenhuma placa pedida', 'Rebaixas geram pedidos de placa automaticamente. Use "Pedir placa" ou importe a planilha do encarte.')
      : vazio('Nenhuma placa', 'Os pedidos de placa desta filial aparecem aqui.');
  }
  function renderPlacaCard(item){
    var st = STATUS.placas[item.status] || STATUS.placas.pendente;
    var tags = '<span class="tag tag-' + st[1] + '">' + st[0] + '</span>' +
      (item.status === 'confirmado' && RESULTADO_LABEL[item.resultado] ? '<span class="tag tag-neutro">' + RESULTADO_LABEL[item.resultado] + '</span>' : '') +
      (item.fidelidade ? '<span class="tag tag-fid">Meu Oriundi</span>' : '') +
      (item.origem === 'rebaixa' ? '<span class="tag tag-neutro">Rebaixa</span>' : '') +
      (item.origem === 'planilha' ? '<span class="tag tag-neutro">Planilha</span>' : '');
    var acts = [];
    if(role === 'marketing' && item.status === 'pendente') acts.push('<button type="button" class="btn btn-primary" onclick="App.confirmPlacaPronta(\'' + item.id + '\')">Marcar como feita</button>');
    if(podePDF()) acts.push('<button type="button" class="btn btn-outline' + (acts.length ? ' btn-sm' : '') + '" onclick="App.abrirPreviaPlaca(\'' + item.id + '\')">Conferir e baixar PDF</button>');
    if(role === 'comprador' && item.status === 'pendente' && item.origem !== 'rebaixa') acts.push('<button type="button" class="btn btn-ghost btn-sm" onclick="App.removePlaca(\'' + item.id + '\')">Cancelar pedido</button>');

    var meta = '<div class="card-meta">Pedida por ' + esc(item.criadoPor || '—') + ' em ' + fmtDateTime(item.criadoEm) + '</div>';
    if(item.prontaEm) meta += '<div class="card-meta">Feita por ' + esc(item.prontaPor || '—') + ' em ' + fmtDateTime(item.prontaEm) + '</div>';
    meta += metaAbastEstoque(item, 'confirmadoEm', 'confirmadoPor', 'Colocada na seção');
    var extra = '';
    if(item.validade) extra += '<div class="card-meta">Oferta válida até <b>' + fmtDate(item.validade) + '</b></div>';
    if(item.nomePlaca && item.nomePlaca !== item.nome) extra += '<div class="card-meta">Na placa: <b>' + esc(item.nomePlaca) + '</b></div>';

    var marcado = !!placaSelecionadas[item.id];
    var check = podePDF()
      ? '<label class="card-sel"><input type="checkbox" class="check" aria-label="Selecionar ' + esc(item.nome) + ' para imprimir" onchange="App.togglePlacaSelecionada(\'' + item.id + '\', this.checked)"' + (marcado ? ' checked' : '') + '></label>'
      : '';
    var abast = (role === 'loja' && item.status === 'pronta') ? botoesAbastecimento('itensPlaca', item) : '';
    return '<article class="card st-' + st[1] + (marcado ? ' selecionado' : '') + '">' +
      '<div class="card-status">' + tags + '</div>' +
      '<div class="card-top">' + check +
        '<div class="card-info"><h3 class="card-name">' + esc(item.nome) + '</h3>' + cardCodigos(item) +
          precoHtml(item.precoDe, item.precoPor, item.infoPlaca) +
          (item.observacao ? '<p class="card-obs">' + esc(item.observacao) + '</p>' : '') +
        '</div></div>' +
      notaEstoque(item) + extra + meta + abast +
      (acts.length ? '<div class="card-actions">' + acts.join('') + '</div>' : '') +
    '</article>';
  }

  /* ----- conferência de estoque ----- */
  function itensConferencia(){
    var lst = [];
    itemsExpo.filter(inActiveFilial).forEach(function(i){ lst.push({ tabela:'itensExpo', item:i }); });
    itemsPlaca.filter(inActiveFilial).forEach(function(i){ lst.push({ tabela:'itensPlaca', item:i }); });
    return lst.filter(function(x){ return x.item.status === 'estoque' || x.item.verificadoEm; });
  }
  function renderEstoqueTab(){
    var todos = itensConferencia();
    var contar = function(f){
      if(f === 'aguardando') return todos.filter(function(x){ return x.item.status === 'estoque'; }).length;
      if(f === 'conferidos') return todos.filter(function(x){ return x.item.status !== 'estoque'; }).length;
      return todos.length;
    };
    var f = filtros.estoque || 'aguardando';
    var lst = todos.filter(function(x){
      if(f === 'aguardando') return x.item.status === 'estoque';
      if(f === 'conferidos') return x.item.status !== 'estoque';
      return true;
    }).sort(function(a, b){
      var ra = a.item.status === 'estoque' ? 0 : 1, rb = b.item.status === 'estoque' ? 0 : 1;
      if(ra !== rb) return ra - rb;
      if(ra === 0) return ts(a.item.enviadoEstoqueEm) - ts(b.item.enviadoEstoqueEm);
      return ts(b.item.verificadoEm) - ts(a.item.verificadoEm);
    });
    var html = chipsHtml('estoque', null, contar);
    if(!lst.length){
      html += f === 'aguardando'
        ? vazio('Nada para conferir', 'Quando o abastecimento não encontrar um produto pedido pelo comprador, ele aparece aqui para você verificar o estoque.')
        : vazio('Nenhuma conferência registrada', 'As respostas do estoque aparecem aqui.');
      return html;
    }
    return html + '<div class="card-list">' + lst.map(renderConferenciaCard).join('') + '</div>';
  }
  function renderConferenciaCard(x){
    var item = x.item, tabela = x.tabela;
    var ehPlaca = tabela === 'itensPlaca';
    var aguardando = item.status === 'estoque';
    var tags = '<span class="tag tag-neutro">' + (ehPlaca ? 'Placa' : 'Exposição') + '</span>';
    if(aguardando) tags = '<span class="tag tag-aguardando">Para conferir</span>' + tags;
    else if(item.verificacao === 'sem_estoque') tags = '<span class="tag tag-urgente">Sem estoque</span>' + tags;
    else tags = '<span class="tag tag-concluido">Encontrado</span>' + tags;
    var pedido = '<div class="card-meta">' + (ehPlaca ? 'Placa pedida por ' : 'Aviso de exposição de ') + esc(item.criadoPor || '—') + ' em ' + fmtDateTime(item.criadoEm) + '</div>';
    var meta = pedido + metaAbastEstoque(item, null, null, '');
    var acoes = '';
    if(aguardando && role === 'estoque'){
      acoes = '<div class="abast" role="group" aria-label="Resultado da conferência">' +
        '<span class="abast-tit">Resultado da conferência</span>' +
        '<button type="button" class="btn btn-primary btn-largo" onclick="App.respostaEstoque(\'' + tabela + '\',\'' + item.id + '\',\'encontrado\')">Encontrado: devolver ao abastecimento</button>' +
        '<button type="button" class="btn btn-alerta" onclick="App.respostaEstoque(\'' + tabela + '\',\'' + item.id + '\',\'sem_estoque\')">Sem estoque: avisar o comprador</button>' +
      '</div>';
    }
    return '<article class="card st-' + (aguardando ? 'aguardando' : (item.verificacao === 'sem_estoque' ? 'urgente' : 'concluido')) + '">' +
      '<div class="card-status">' + tags + '</div>' +
      '<div class="card-info"><h3 class="card-name">' + esc(item.nome) + '</h3>' + cardCodigos(item) +
        (ehPlaca ? precoHtml(item.precoDe, item.precoPor, item.infoPlaca) : '') +
        (item.observacao ? '<p class="card-obs">' + esc(item.observacao) + '</p>' : '') +
      '</div>' +
      meta + acoes +
    '</article>';
  }

  function toggleSelectAllPlacas(checked){
    listaPlacasFiltrada().forEach(function(i){
      if(checked) placaSelecionadas[i.id] = true;
      else delete placaSelecionadas[i.id];
    });
    renderMain();
    renderSelBar();
  }
  function togglePlacaSelecionada(id, checked){
    if(checked) placaSelecionadas[id] = true;
    else delete placaSelecionadas[id];
    renderMain();
    renderSelBar();
  }
  function limparSelecao(){
    placaSelecionadas = {};
    renderMain();
    renderSelBar();
  }

  function renderSelBar(){
    var bar = el('selBar');
    var n = (currentUser && podePDF() && activeTab === 'placas' && !el('authScreen').classList.contains('open')) ? idsSelecionadosVisiveis().length : 0;
    if(!n){
      bar.classList.remove('on');
      bar.innerHTML = '';
      document.body.classList.remove('com-sel');
      return;
    }
    bar.classList.add('on');
    document.body.classList.add('com-sel');
    bar.innerHTML = '<div class="in"><span class="txt">' + (n === 1 ? '1 placa selecionada' : n + ' placas selecionadas') + '</span>' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="App.limparSelecao()">Limpar</button>' +
      '<button type="button" class="btn btn-primary" onclick="App.abrirPreviaSelecionadas()">Conferir e gerar PDF</button></div>';
  }

  /* ---------- funções chamadas pelos botões ---------- */
  window.App = {
    submitSetup:submitSetup, submitLogin:submitLogin, logout:logout,
    abrirConta:abrirConta, enviarAgora:enviarAgora, ativarAlertas:ativarAlertas,
    openUsersModal:openUsersModal, addUser:addUser, resetUserPin:resetUserPin, removeUser:removeUser, onRoleChange:onRoleChange,
    setTab:function(t){ activeTab = t; render(); try{ window.scrollTo({ top:0 }); }catch(e){} },
    setFiltro:function(tab, f){ filtros[tab] = f; render(); },
    closeModal:closeModal, fecharDialogo:fecharDialogo, confirmarDialogo:confirmarDialogo,
    openNewExpoModal:openNewExpoModal, submitNewExpo:submitNewExpo, removeExpo:removeExpo,
    confirmarAbastecimento:confirmarAbastecimento, naoEncontrado:naoEncontrado, respostaEstoque:respostaEstoque,
    openNewValModal:openNewValModal, submitNewVal:submitNewVal,
    openRebaixaModal:openRebaixaModal, submitRebaixa:submitRebaixa,
    descontoRebaixa:function(){ atualizarDesconto('fr-precode', 'fr-preco', 'fr-desc'); },
    openNewPlacaModal:openNewPlacaModal, submitNewPlaca:function(){ submitNewPlaca(false); }, removePlaca:removePlaca,
    setPlacaTipo:setPlacaTipo, descontoPlaca:function(){ atualizarDesconto('fp-precode', 'fp-precopor', 'fp-desc'); },
    confirmPlacaPronta:confirmPlacaPronta,
    abrirImportarPlacas:abrirImportarPlacas, handlePlacasFile:handlePlacasFile, confirmarImportPlacas:confirmarImportPlacas, baixarModeloPlacas:baixarModeloPlacas,
    openImportDBModal:openImportDBModal, handleDBFile:handleDBFile, confirmImport:confirmImport, clearDB:clearDB,
    closeScanner:closeScanner, scanFromFile:scanFromFile,
    produtoInput:produtoInput, produtoTecla:produtoTecla, produtoBlur:produtoBlur, escolherSugestao:escolherSugestao,
    scanProduto:scanProduto, produtoTrocar:produtoTrocar, produtoEditar:produtoEditar, produtoManual:produtoManual,
    setActiveFilial:setActiveFilial,
    submitApiUrl:submitApiUrl, retryApi:retryApi, changeApiUrl:changeApiUrl,
    toggleSelectAllPlacas:toggleSelectAllPlacas, togglePlacaSelecionada:togglePlacaSelecionada, limparSelecao:limparSelecao,
    abrirPreviaPlaca:abrirPreviaPlaca, abrirPreviaSelecionadas:abrirPreviaSelecionadas,
    previaAnterior:previaAnterior, previaProxima:previaProxima, previaAtualiza:previaAtualiza,
    previaTelaCheia:previaTelaCheia, baixarPreviaPDF:baixarPreviaPDF
  };

  /* ---------- início ---------- */
  // Poppins (já embutida para o PDF) passa a ser usada também nos títulos do app
  (function(){
    try{
      var st = document.createElement('style');
      st.textContent =
        "@font-face{font-family:'Poppins';font-weight:600;font-style:normal;font-display:swap;src:url(data:font/ttf;base64," + POPPINS_SEMI_B64 + ") format('truetype');}";
      document.head.appendChild(st);
    }catch(e){}
  })();

  carregarFila();
  loadApiUrl();
  if(SHEETS_API_URL){
    apiLoading = true;
    loadAll().then(function(){
      apiLoading = false;
      if(apiOk) tryRestoreSession();
      render();
    });
  }
  render();

})();
</script>
</body>
</html>
