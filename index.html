  /* Confirmação dentro do app (no lugar de confirm/prompt do navegador).
     opts: titulo, texto (HTML já escapado), confirmar, cancelar, perigo,
     campo {label, placeholder, inputmode, maxlength, classe},
     onConfirmar(valor) -> devolve texto de erro para manter aberto. */
  var dialogoAtual = null;
  function dialogo(opts){
    dialogoAtual = opts;
    var c = opts.campo;
    el('dialogBody').innerHTML =
      '<h3 id="dlg-t">' + esc(opts.titulo) + '</h3>' +
      (opts.texto ? '<p class="txt">' + opts.texto + '</p>' : '') +
      (c ? '<div class="field" id="dlg-field"><label for="dlg-in">' + esc(c.label) + '</label>' +
             '<input type="text" id="dlg-in" autocomplete="off" class="' + (c.classe||'') + '"' +
             (c.inputmode ? ' inputmode="' + c.inputmode + '"' : '') +
             (c.maxlength ? ' maxlength="' + c.maxlength + '"' : '') +
             ' placeholder="' + esc(c.placeholder||'') + '" onkeydown="if(event.key===\'Enter\'){event.preventDefault();App.confirmarDialogo();}">' +
             '<p class="field-erro" id="dlg-erro" hidden></p></div>' : '') +
      '<div class="acts">' +
        (opts.cancelar === false ? '' : '<button type="button" class="btn btn-outline" onclick="App.fecharDialogo()">' + esc(opts.cancelar || 'Voltar') + '</button>') +
        '<button type="button" class="btn ' + (opts.perigo ? 'btn-danger' : 'btn-primary') + '" id="dlg-ok" onclick="App.confirmarDialogo()">' + esc(opts.confirmar || 'Confirmar') + '</button>' +
      '</div>';
    el('dialogBackdrop').classList.add('open');
    setTimeout(function(){
      var alvo = el('dlg-in') || el('dlg-ok');
      if(alvo) try{ alvo.focus(); }catch(e){}
    }, 30);
  }
  function confirmarDialogo(){
    var o = dialogoAtual;
    if(!o) return;
    var inp = el('dlg-in');
    var r = o.onConfirmar ? o.onConfirmar(inp ? inp.value.trim() : undefined) : true;
    if(typeof r === 'string'){
      var e = el('dlg-erro');
      if(e){ e.textContent = r; e.hidden = false; el('dlg-field').classList.add('erro'); }
      return;
    }
    fecharDialogo();
  }
  function fecharDialogo(){
    dialogoAtual = null;
    el('dialogBackdrop').classList.remove('open');
    el('dialogBody').innerHTML = '';
  }

  /* acao (opcional): { rotulo:'Desfazer', fn:function(){...} } */
  function aviso(msg, tipo, acao){
    var area = el('toasts');
    if(!area) return;
    var t = document.createElement('div');
    t.className = 'toast' + (tipo === 'erro' ? ' erro' : '');
    t.setAttribute('role', tipo === 'erro' ? 'alert' : 'status');
    var txt = document.createElement('span');
    txt.textContent = msg;
    t.appendChild(txt);
    var fechar = function(){
      t.classList.add('sai');
      setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
    };
    // um aviso por vez: o novo substitui o anterior e não cobre os botões dos cards
    Array.prototype.forEach.call(area.querySelectorAll('.toast'), function(v){ if(v.parentNode) v.parentNode.removeChild(v); });
    if(acao){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'toast-acao';
      b.textContent = acao.rotulo;
      b.onclick = function(){ fechar(); acao.fn(); };
      t.appendChild(b);
    }
    area.appendChild(t);
    setTimeout(fechar, acao ? 7000 : (tipo === 'erro' ? 6000 : 3800));
  }

  /* Erros de preenchimento aparecem no próprio campo, todos de uma vez. */
  function limparErros(){
    var raiz = el('modalBody');
    Array.prototype.forEach.call(raiz.querySelectorAll('.field.erro'), function(f){ f.classList.remove('erro'); });
    Array.prototype.forEach.call(raiz.querySelectorAll('.field-erro.din'), function(p){ p.parentNode.removeChild(p); });
  }
  function erroCampo(id, msg){
    var alvo = el(id);
    if(!alvo) return;
    var f = alvo.closest('.field') || alvo.parentNode;
    f.classList.add('erro');
    var p = document.createElement('p');
    p.className = 'field-erro din';
    p.textContent = msg;
    f.appendChild(p);
  }
  // ao corrigir um campo, a mensagem de erro dele some
  document.addEventListener('input', function(e){
    var f = e.target && e.target.closest && e.target.closest('.field.erro');
    if(!f) return;
    f.classList.remove('erro');
    Array.prototype.forEach.call(f.querySelectorAll('.field-erro.din'), function(p){ p.parentNode.removeChild(p); });
  });
  document.addEventListener('change', function(e){
    var f = e.target && e.target.closest && e.target.closest('.field.erro');
    if(f && e.target.type === 'checkbox'){
      f.classList.remove('erro');
      Array.prototype.forEach.call(f.querySelectorAll('.field-erro.din'), function(p){ p.parentNode.removeChild(p); });
    }
  });

  function focarPrimeiroErro(){
    var f = el('modalBody').querySelector('.field.erro');
    if(!f) return;
    try{ f.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(e){ f.scrollIntoView(); }
    var i = f.querySelector('input:not([type=hidden]):not([type=file]),textarea,select');
    if(i) try{ i.focus({ preventScroll:true }); }catch(e){}
  }

  document.addEventListener('keydown', function(e){
    if(e.key !== 'Escape') return;
    if(dialogoAtual){ fecharDialogo(); return; }
    if(el('scanBackdrop').classList.contains('open')){ closeScanner(); return; }
    if(modalAberto) closeModal();
  });

  /* ---------- base de produtos (planilha do comprador) ---------- */
  function openImportDBModal(){
    pendingImport = null;
    var count = Object.keys(productDB).length;
    showModal(
      cabecalhoModal('Base de produtos') +
      '<p class="hint" style="margin-top:0">Envie uma planilha (.xlsx ou .csv) com código de barras, código interno e descrição. Os nomes das colunas podem variar: o Giro reconhece termos como "EAN", "Cód. Barras", "Código interno" e "Descrição". A importação atualiza e adiciona itens, sem apagar o que já existe.</p>' +
      '<div class="field" style="margin-top:14px"><label class="btn btn-outline file-btn">Escolher planilha<input type="file" accept=".csv,.xlsx,.xls" onchange="App.handleDBFile(event)"></label></div>' +
      '<div id="import-preview"></div>' +
      '<div class="context-card" id="db-current-count">Base atual: <strong>' + count.toLocaleString('pt-BR') + ' ' + (count === 1 ? 'item' : 'itens') + '</strong>.' +
        (count ? ' <button type="button" class="btn-link" onclick="App.clearDB()">Apagar a base</button>' : '') +
      '</div>'
    );
  }

  function handleDBFile(evt){
    var file = evt.target.files && evt.target.files[0];
    if(!file) return;
    var preview = el('import-preview');
    preview.innerHTML = '<div class="lookup-status">Lendo planilha…</div>';
    parseSpreadsheetFile(file).then(function(rows){
      var mapped = mapRowsToProducts(rows);
      if(!mapped.count){
        preview.innerHTML = '<div class="warn-box">Não encontramos uma coluna de código de barras nessa planilha. Confira os nomes das colunas e tente de novo.</div>';
        return;
      }
      pendingImport = mapped.map;
      var sampleKeys = Object.keys(mapped.map).slice(0,5);
      var rowsHtml = sampleKeys.map(function(bc){
        var p = mapped.map[bc];
        return '<tr><td class="mono">'+esc(bc)+'</td><td class="mono">'+esc(p.codigoInterno||'—')+'</td><td>'+esc(p.descricao||'—')+'</td></tr>';
      }).join('');
      preview.innerHTML =
        '<div class="lookup-status ok">' + mapped.count.toLocaleString('pt-BR') + ' itens reconhecidos. Primeiros da lista:</div>' +
        '<div class="tabela-rolavel"><table class="import-table"><tr><th>Cód. barras</th><th>Cód. Int.</th><th>Descrição</th></tr>' + rowsHtml + '</table></div>' +
        '<button type="button" class="btn btn-primary btn-block" style="margin:14px 0" onclick="App.confirmImport()">Importar ' + mapped.count.toLocaleString('pt-BR') + ' itens</button>';
    }).catch(function(){
      preview.innerHTML = '<div class="warn-box">Não foi possível ler esse arquivo. Confira se é um .xlsx ou .csv válido.</div>';
    });
  }

  function confirmImport(){
    if(!pendingImport) return;
    var added = Object.keys(pendingImport).length;
    for(var bc in pendingImport){ productDB[bc] = pendingImport[bc]; }
    rebuildProductIndex();
    var preview = el('import-preview');
    if(preview) preview.innerHTML = '<div class="lookup-status">Salvando ' + added.toLocaleString('pt-BR') + ' itens na planilha. Isso pode levar alguns segundos…</div>';
    persistDB().then(function(){
      pendingImport = null;
      closeModal();
      render();
      aviso(added.toLocaleString('pt-BR') + ' itens importados para a base de produtos.');
    }).catch(function(err){
      if(preview) preview.innerHTML =
        '<div class="warn-box">Não foi possível salvar na planilha agora (' + esc(String((err&&err.message)||err)) + '). Confira a conexão e tente de novo.</div>' +
        '<button type="button" class="btn btn-primary btn-block" style="margin-top:12px" onclick="App.confirmImport()">Tentar de novo</button>';
    });
  }

  function clearDB(){
    dialogo({
      titulo:'Apagar a base de produtos?',
      texto:'A busca por código e por nome deixa de funcionar até você importar uma planilha de novo. Os itens já registrados no Giro não são afetados.',
      confirmar:'Apagar base', perigo:true,
      onConfirmar:function(){
        var backup = productDB;
        productDB = {};
        rebuildProductIndex();
        persistDB().then(function(){
          closeModal(); render();
          aviso('Base de produtos apagada.');
        }).catch(function(){
          productDB = backup;
          rebuildProductIndex();
          aviso('Não foi possível apagar a base agora. Confira a conexão e tente de novo.', 'erro');
        });
      }
    });
  }

  function productDBToArray(){
    return Object.keys(productDB).map(function(bc){
      var p = productDB[bc] || {};
      return { barcode:bc, descricao:p.descricao||'', codigoInterno:p.codigoInterno||'', foto:'' };
    });
  }
  function persistDB(){
    return apiPost('saveProdutos', productDBToArray());
  }

  /* ---------- filiais e papéis ---------- */
  /* 'loja' é o setor de Abastecimento (o id interno continua 'loja' para não mexer nos cadastros) */
  var ROLE_LABEL = { comprador:'Comprador', loja:'Abastecimento', marketing:'Marketing', estoque:'Estoque' };
  var FILIAIS = [
    { id:'aracruz',  label:'1 - ARACRUZ',  curto:'Aracruz'  },
    { id:'linhares', label:'2 - LINHARES', curto:'Linhares' }
  ];
  var FILIAL_LABEL = {}, FILIAL_CURTO = {};
  FILIAIS.forEach(function(f){ FILIAL_LABEL[f.id] = f.label; FILIAL_CURTO[f.id] = f.curto; });
  function filialLabel(id){ return FILIAL_LABEL[id] || '—'; }
  function filialCurta(id){ return FILIAL_CURTO[id] || '—'; }

  function isComprador(){ return role === 'comprador'; }
  function podePDF(){ return role === 'comprador' || role === 'marketing'; }

  function userFiliais(u){
    if(!u) return [];
    if(u.papel === 'comprador') return FILIAIS.map(function(f){ return f.id; });
    return u.filial ? [u.filial] : [];
  }
  function setActiveFilial(id){
    if(userFiliais(currentUser).indexOf(id) === -1) return;
    activeFilial = id;
    placaSelecionadas = {};
    try{ localStorage.setItem('giro-filial', id); }catch(e){}
    render();
  }
  /* Itens antigos, de antes da separação por filial, aparecem nas duas. */
  function inActiveFilial(item){
    if(!item.filial) return true;
    return item.filial === activeFilial;
  }
  function daFilial(arr, fil){
    return arr.filter(function(i){ return !i.filial || i.filial === fil; });
  }

  function normalizedPin(v){ return String(v||'').trim(); }

  /* ---------- telas de entrada ---------- */
  function renderGate(){
    var box = el('authScreen');
    var needsGate = !SHEETS_API_URL || apiLoading || !apiOk || !currentUser;
    if(!needsGate){
      box.classList.remove('open');
      box.innerHTML = '';
      return false;
    }
    box.classList.add('open');
    if(!SHEETS_API_URL) box.innerHTML = renderConfigScreen();
    else if(apiLoading) box.innerHTML = renderLoadingScreen();
    else if(!apiOk) box.innerHTML = renderErrorScreen();
    else box.innerHTML = users.length ? renderLoginForm() : renderSetupForm();
    return true;
  }

  function logoAuth(){ return '<div class="auth-logo"><img src="' + LOGO_SRC + '" alt="Oriundi Supermercados"></div>'; }

  function renderConfigScreen(){
    return '<div class="auth-card">' + logoAuth() +
      '<h1 class="auth-title">Conectar à planilha</h1>' +
      '<p class="auth-sub">Cole o endereço do Apps Script que o comprador enviou. Ele termina em <b>/exec</b> e só precisa ser colado uma vez neste aparelho.</p>' +
      (authError ? '<div class="auth-error" role="alert">'+esc(authError)+'</div>' : '') +
      '<div class="field"><label for="cfg-url">Endereço do Apps Script</label><input type="text" id="cfg-url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec" onkeydown="if(event.key===\'Enter\')App.submitApiUrl()"></div>' +
      '<button type="button" class="btn btn-primary btn-block" onclick="App.submitApiUrl()">Conectar</button>' +
    '</div>';
  }

  function submitApiUrl(){
    var v = val('cfg-url').replace(/\/+$/, '');
    if(!/^https:\/\//i.test(v)){ authError = 'O endereço precisa começar com https://. Copie e cole de novo o link completo.'; renderGate(); return; }
    if(!/\/exec$/.test(v)){ authError = 'O endereço precisa terminar em /exec. Confira se copiou o link do "App da Web".'; renderGate(); return; }
    authError = '';
    saveApiUrl(v);
    apiLoading = true; apiOk = true;
    render();
    loadAll().then(function(){
      apiLoading = false;
      if(apiOk) tryRestoreSession();
      render();
    });
  }

  function renderLoadingScreen(){
    return '<div class="auth-card auth-centro">' + logoAuth() +
      '<div class="spinner" aria-hidden="true"></div>' +
      '<p class="auth-sub" style="margin:14px 0 0 0" role="status">Carregando dados da planilha…</p>' +
    '</div>';
  }

  function renderErrorScreen(){
    return '<div class="auth-card">' + logoAuth() +
      '<h1 class="auth-title">Sem conexão com a planilha</h1>' +
      '<p class="auth-sub">Este aparelho não conseguiu acessar o Google Apps Script.</p>' +
      '<ul class="auth-dicas">' +
        '<li>Se o Giro abre no celular e não neste computador, a rede da empresa provavelmente está bloqueando o acesso. Peça à TI para liberar <b>script.google.com</b> e <b>script.googleusercontent.com</b>.</li>' +
        '<li>Confira se o aparelho está com internet.</li>' +
        '<li>Se o script foi publicado de novo com outro endereço, troque o endereço abaixo.</li>' +
      '</ul>' +
      '<button type="button" class="btn btn-primary btn-block" onclick="App.retryApi()">Tentar de novo</button>' +
      '<div class="auth-centro"><button type="button" class="btn-link" onclick="App.changeApiUrl()">Trocar endereço da planilha</button></div>' +
      '<details class="auth-tec"><summary>Detalhe técnico</summary><code>' + esc(apiError || 'Erro desconhecido') + '</code></details>' +
    '</div>';
  }

  function retryApi(){
    apiLoading = true; render();
    loadAll().then(function(){
      apiLoading = false;
      if(apiOk) tryRestoreSession();
      render();
    });
  }

  function changeApiUrl(){
    dialogo({
      titulo:'Trocar o endereço da planilha?',
      texto:'Você vai precisar colar o novo endereço do Apps Script. As alterações ainda não enviadas continuam guardadas neste aparelho.',
      confirmar:'Trocar endereço',
      onConfirmar:function(){
        clearApiUrl();
        apiOk = true; apiError = '';
        currentUser = null; role = null;
        stopPolling();
        try{ localStorage.removeItem('giro-user-id'); }catch(e){}
        render();
      }
    });
  }

  function renderSetupForm(){
    return '<div class="auth-card">' + logoAuth() +
      '<h1 class="auth-title">Bem-vindo ao Giro</h1>' +
      '<p class="auth-sub">Ainda não há usuários. Crie o primeiro acesso: ele será Comprador e poderá cadastrar os demais.</p>' +
      (authError ? '<div class="auth-error" role="alert">'+esc(authError)+'</div>' : '') +
      '<div class="field"><label for="su-nome">Seu nome</label><input type="text" id="su-nome" autocomplete="given-name" placeholder="Ex.: Vitor"></div>' +
      '<div class="field"><label for="su-pin">Crie um PIN de 4 números</label><input type="text" class="pin-input" id="su-pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"></div>' +
      '<button type="button" class="btn btn-primary btn-block" onclick="App.submitSetup()">Criar usuário e entrar</button>' +
    '</div>';
  }

  function submitSetup(){
    var nome = val('su-nome');
    var pin = normalizedPin(val('su-pin'));
    if(!nome){ authError = 'Informe seu nome.'; renderGate(); return; }
    if(!/^\d{4}$/.test(pin)){ authError = 'O PIN precisa ter 4 números.'; renderGate(); return; }
    var user = { id:uid(), nome:nome, papel:'comprador', pin:pin, filial:'' };
    users = [user];
    salvarItem('usuarios', user);
    authError = '';
    applyLogin(user);
    render();
  }

  function renderLoginForm(){
    var saved = null;
    try{ saved = localStorage.getItem('giro-ultimo-usuario'); }catch(e){}
    var options = '<option value="">Escolha seu nome</option>' + users.map(function(u){
      return '<option value="'+esc(u.id)+'"'+(u.id===saved?' selected':'')+'>'+esc(u.nome)+' ('+(ROLE_LABEL[u.papel]||u.papel)+(u.papel!=='comprador'&&u.filial?', '+esc(filialCurta(u.filial)):'')+')</option>';
    }).join('');
    return '<div class="auth-card">' + logoAuth() +
      '<h1 class="auth-title">Entrar no Giro</h1>' +
      '<p class="auth-sub">Escolha seu nome e digite seu PIN.</p>' +
      (authError ? '<div class="auth-error" role="alert">'+esc(authError)+'</div>' : '') +
      '<div class="field"><label for="li-user">Quem é você?</label><select id="li-user" class="select">'+options+'</select></div>' +
      '<div class="field"><label for="li-pin">PIN</label><input type="text" class="pin-input" id="li-pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" onkeydown="if(event.key===\'Enter\')App.submitLogin()"></div>' +
      '<button type="button" class="btn btn-primary btn-block" onclick="App.submitLogin()">Entrar</button>' +
      '<p class="hint auth-centro" style="margin-top:14px">Esqueceu o PIN? Peça ao comprador para redefinir.</p>' +
    '</div>';
  }

  function visibleTabsFor(r){
    if(r === 'marketing') return ['placas'];
    if(r === 'estoque') return ['estoque'];
    return ['expo','val','placas'];
  }

  function submitLogin(){
    var userId = val('li-user');
    var pin = normalizedPin(val('li-pin'));
    if(!userId){ authError = 'Escolha seu nome na lista.'; renderGate(); return; }
    var user = users.filter(function(u){ return u.id === userId; })[0];
    if(!user || String(user.pin) !== pin){
      authError = 'PIN incorreto. Tente de novo.';
      renderGate();
      var p = el('li-user'); if(p) p.value = userId;
      return;
    }
    authError = '';
    if(!applyLogin(user)){ renderGate(); return; }
    render();
  }

  /* Aplica o login (cadastro inicial, login manual ou sessão lembrada). */
  function applyLogin(user){
    currentUser = user;
    role = user.papel;

    var allowed = userFiliais(user);
    if(!allowed.length){
      authError = 'Seu acesso ainda não tem filial definida. Peça ao comprador para ajustar seu cadastro em Usuários.';
      currentUser = null; role = null;
      return false;
    }
    if(user.papel === 'comprador'){
      var saved = null;
      try{ saved = localStorage.getItem('giro-filial'); }catch(e){}
      activeFilial = (saved && allowed.indexOf(saved) !== -1) ? saved : allowed[0];
    } else {
      activeFilial = allowed[0];
    }

    // cada papel abre no que depende dele
    filtros.expo = 'pendente';
    filtros.val = 'aguardando';
    filtros.placas = role === 'marketing' ? 'pendente' : (role === 'loja' ? 'pronta' : 'todos');
    filtros.estoque = 'aguardando';
    novidadesConhecidas = null;
    var visible = visibleTabsFor(role);
    var comAcao = visible.filter(function(t){ return contagensAba(t).acao > 0; });
    activeTab = comAcao.length ? comAcao[0] : visible[0];
    placaSelecionadas = {};

    try{
      localStorage.setItem('giro-user-id', user.id);
      localStorage.setItem('giro-ultimo-usuario', user.id);
    }catch(e){}
    startPolling();
    setTimeout(function(){ verificarNovidades(false); }, 0);
    return true;
  }

  function tryRestoreSession(){
    if(currentUser) return;
    var savedId = null;
    try{ savedId = localStorage.getItem('giro-user-id'); }catch(e){}
    if(!savedId) return;
    var user = users.filter(function(u){ return u.id === savedId; })[0];
    if(user) applyLogin(user);
  }

  function logout(){
    closeModal();
    currentUser = null;
    role = null;
    placaSelecionadas = {};
    stopPolling();
    try{ localStorage.removeItem('giro-user-id'); }catch(e){}
    render();
  }

  /* ---------- conta (menu do usuário) ---------- */
  function renderConta(){
    var b = el('contaBtn');
    if(!currentUser){ b.hidden = true; return; }
    b.hidden = false;
    var sub = isComprador() ? 'Comprador' : (ROLE_LABEL[role] + ', ' + filialCurta(activeFilial));
    b.innerHTML = '<span class="conta-txt"><span class="nome">' + esc(currentUser.nome) + '</span><span class="sub">' + esc(sub) + '</span></span>' +
      '<span class="avatar" aria-hidden="true">' + esc(iniciais(currentUser.nome)) + '</span>';
    b.setAttribute('aria-label', 'Sua conta: ' + currentUser.nome + ', ' + sub);
  }

  function statusSyncHtml(){
    if(!fila.length) return '<div class="sync-info">Tudo salvo na planilha.</div>';
    return '<div class="sync-info"><span>' + plural(fila.length, 'alteração aguardando', 'alterações aguardando') + ' envio. Elas estão guardadas neste aparelho.</span>' +
      '<button type="button" class="btn btn-outline btn-sm" onclick="App.enviarAgora()">Enviar agora</button></div>';
  }

  function alertasHtml(){
    var suporta = false, estado = '';
    try{ suporta = typeof Notification !== 'undefined'; estado = suporta ? Notification.permission : ''; }catch(e){}
    if(!suporta) return '';
    if(estado === 'granted') return '<div class="sync-info">Alertas do navegador ativos neste aparelho.</div>';
    if(estado === 'denied') return '<div class="sync-info">Alertas do navegador bloqueados. Para ativar, libere as notificações do site nas configurações do navegador.</div>';
    return '<div class="sync-info"><span>Receba um alerta do navegador quando chegar item novo para você, mesmo com o Giro em outra aba.</span>' +
      '<button type="button" class="btn btn-outline btn-sm" onclick="App.ativarAlertas()">Ativar alertas</button></div>';
  }
  function ativarAlertas(){
    try{
      Notification.requestPermission().then(function(){ abrirConta(); });
    }catch(e){ aviso('Este navegador não permite alertas.', 'erro'); }
  }

  function abrirConta(){
    if(!currentUser) return;
    var desc = isComprador() ? 'Comprador, acesso às duas filiais' : (ROLE_LABEL[role] + ', filial ' + filialCurta(activeFilial));
    var nBase = Object.keys(productDB).length;
    showModal(
      cabecalhoModal('Sua conta') +
      '<div class="conta-info"><b>' + esc(currentUser.nome) + '</b><span>' + esc(desc) + '</span></div>' +
      (isComprador()
        ? '<div class="menu-lista">' +
            '<button type="button" class="menu-item" onclick="App.openImportDBModal()"><span>Base de produtos</span><span class="menu-n">' + nBase.toLocaleString('pt-BR') + ' itens</span></button>' +
            '<button type="button" class="menu-item" onclick="App.openUsersModal()"><span>Usuários</span><span class="menu-n">' + users.length + '</span></button>' +
          '</div>'
        : '') +
      statusSyncHtml() +
      alertasHtml() +
      '<button type="button" class="btn btn-outline btn-block" onclick="App.logout()">Sair</button>' +
      '<p class="hint auth-centro" style="margin-top:14px">Giro versão ' + APP_VERSAO + (backendVersao >= SCRIPT_VERSAO_MIN ? '' : ', script da planilha desatualizado') + '</p>'
    );
  }

  /* ---------- usuários ---------- */
  function openUsersModal(){
    showModal(
      cabecalhoModal('Usuários') +
      '<div id="users-list">' + renderUsersList() + '</div>' +
      '<h4 class="secao-tit">Novo usuário</h4>' +
      '<div class="field"><label for="nu-nome">Nome</label><input type="text" id="nu-nome" autocomplete="off" placeholder="Nome da pessoa"></div>' +
      '<div class="row2">' +
        '<div class="field"><label for="nu-papel">Papel</label><select id="nu-papel" class="select" onchange="App.onRoleChange()">' +
          '<option value="loja">Abastecimento</option><option value="estoque">Estoque</option><option value="marketing">Marketing</option><option value="comprador">Comprador</option>' +
        '</select></div>' +
        '<div class="field" id="nu-filial-field"><label for="nu-filial">Filial</label><select id="nu-filial" class="select">' +
          FILIAIS.map(function(f){ return '<option value="'+f.id+'">'+esc(f.label)+'</option>'; }).join('') +
        '</select></div>' +
      '</div>' +
      '<p class="hint" id="nu-filial-hint" style="margin:-8px 0 16px 0"></p>' +
      '<div class="field"><label for="nu-pin">PIN de 4 números</label><input type="text" class="pin-input" id="nu-pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"></div>' +
      '<button type="button" class="btn btn-primary btn-block" onclick="App.addUser()">Adicionar usuário</button>'
    );
    onRoleChange();
  }

  function onRoleChange(){
    var papelEl = el('nu-papel'), filialField = el('nu-filial-field'), hint = el('nu-filial-hint');
    if(!papelEl || !filialField) return;
    var isComp = papelEl.value === 'comprador';
    filialField.hidden = isComp;
    if(hint) hint.textContent = isComp
      ? 'Compradores têm acesso às duas filiais.'
      : 'Abastecimento, Estoque e Marketing só veem as demandas da filial escolhida.';
  }

  function renderUsersList(){
    if(!users.length) return '<p class="hint">Nenhum usuário cadastrado ainda.</p>';
    return users.map(function(u){
      var desc = (ROLE_LABEL[u.papel]||u.papel) + ', ' + (u.papel === 'comprador' ? 'todas as filiais' : (u.filial ? filialCurta(u.filial) : 'sem filial definida'));
      return '<div class="user-row">' +
        '<div><div class="u-name">' + esc(u.nome) + (currentUser && u.id === currentUser.id ? ' (você)' : '') + '</div>' +
          '<div class="u-role">' + esc(desc) + '</div></div>' +
        '<div class="u-actions">' +
          '<button type="button" class="btn btn-ghost btn-sm" onclick="App.resetUserPin(\'' + u.id + '\')">Redefinir PIN</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" onclick="App.removeUser(\'' + u.id + '\')">Remover</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }
  function refreshUsersList(){
    var box = el('users-list');
    if(box) box.innerHTML = renderUsersList();
  }

  function addUser(){
    limparErros();
    var nome = val('nu-nome');
    var papel = val('nu-papel');
    var pin = normalizedPin(val('nu-pin'));
    var ok = true;
    if(!nome){ erroCampo('nu-nome', 'Informe o nome.'); ok = false; }
    if(!/^\d{4}$/.test(pin)){ erroCampo('nu-pin', 'O PIN precisa ter 4 números.'); ok = false; }
    var filial = papel === 'comprador' ? '' : val('nu-filial');
    if(papel !== 'comprador' && !filial){ erroCampo('nu-filial', 'Escolha a filial.'); ok = false; }
    if(!ok){ focarPrimeiroErro(); return; }
    var u = { id:uid(), nome:nome, papel:papel, pin:pin, filial:filial };
    users.push(u);
    salvarItem('usuarios', u);
    el('nu-nome').value = '';
    el('nu-pin').value = '';
    refreshUsersList();
    render();
    aviso(nome + ' foi adicionado. Envie o PIN para a pessoa por mensagem.');
  }

  function resetUserPin(id){
    var u = users.filter(function(x){ return x.id === id; })[0];
    if(!u) return;
    dialogo({
      titulo:'Novo PIN para ' + u.nome,
      campo:{ label:'PIN de 4 números', inputmode:'numeric', maxlength:4, classe:'pin-input', placeholder:'••••' },
      confirmar:'Salvar PIN',
      onConfirmar:function(v){
        v = normalizedPin(v);
        if(!/^\d{4}$/.test(v)) return 'O PIN precisa ter 4 números.';
        u.pin = v;
        salvarItem('usuarios', u, ['pin']);
        aviso('PIN de ' + u.nome + ' atualizado.');
      }
    });
  }

  function removeUser(id){
    var u = users.filter(function(x){ return x.id === id; })[0];
    if(!u) return;
    var compradores = users.filter(function(x){ return x.papel === 'comprador'; });
    if(u.papel === 'comprador' && compradores.length <= 1){
      dialogo({ titulo:'Não é possível remover', texto:'Este é o único Comprador. Cadastre outro Comprador antes de remover este acesso.', confirmar:'Entendi', cancelar:false });
      return;
    }
    dialogo({
      titulo:'Remover o acesso de ' + u.nome + '?',
      texto:'A pessoa não vai mais conseguir entrar no Giro. O histórico do que ela registrou continua.',
      confirmar:'Remover acesso', perigo:true,
      onConfirmar:function(){
        users = users.filter(function(x){ return x.id !== id; });
        removerItem('usuarios', id);
        refreshUsersList();
        render();
        aviso('Acesso de ' + u.nome + ' removido.');
      }
    });
  }



  /* ---------- campo único de produto ----------
     Um só campo aceita código de barras, código interno ou parte do nome.
     O produto escolhido aparece num cartão com nome e códigos; dá para
     trocar ou corrigir. Se não estiver na base, preenche-se à mão. */
  var formProduto = {};
  var acState = {};
  var acTimer = null;
  var buscaToken = {};

  function campoProdutoHtml(ctx){
    return '<div class="field" id="'+ctx+'-campo">' +
      '<label for="'+ctx+'-q" id="'+ctx+'-lbl">Produto</label>' +
      '<div id="'+ctx+'-busca">' +
        '<div class="barcode-row"><div class="ac-wrap">' +
          '<input type="text" id="'+ctx+'-q" autocomplete="off" spellcheck="false" placeholder="Código de barras, Cód. Int. ou nome" ' +
            'role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="'+ctx+'-ac" ' +
            'oninput="App.produtoInput(\''+ctx+'\')" onkeydown="App.produtoTecla(event,\''+ctx+'\')" onblur="App.produtoBlur(\''+ctx+'\')">' +
          '<div id="'+ctx+'-ac" role="listbox" aria-label="Sugestões de produto"></div>' +
        '</div>' +
        '<button type="button" class="scan-btn" aria-label="Escanear código de barras" onclick="App.scanProduto(\''+ctx+'\')">' + cameraIcon() + '</button></div>' +
        '<p class="hint" id="'+ctx+'-status" aria-live="polite">Escaneie, digite o código ou busque pelo nome.</p>' +
      '</div>' +
      '<div id="'+ctx+'-sel"></div>' +
      '<div id="'+ctx+'-manual" class="manual" hidden>' +
        '<div class="field"><label for="'+ctx+'-barcode">Código de barras</label><div class="barcode-row"><input type="text" id="'+ctx+'-barcode" inputmode="numeric" autocomplete="off"><button type="button" class="scan-btn" aria-label="Escanear código de barras" onclick="App.scanProduto(\''+ctx+'\')">' + cameraIcon() + '</button></div></div>' +
        '<div class="field"><label for="'+ctx+'-nome">Nome do produto</label><input type="text" id="'+ctx+'-nome" autocomplete="off"></div>' +
        '<div class="field" style="margin-bottom:4px"><label for="'+ctx+'-codint">Código interno (opcional)</label><input type="text" id="'+ctx+'-codint" inputmode="numeric" autocomplete="off"></div>' +
      '</div>' +
      '<button type="button" class="btn-link" id="'+ctx+'-modo" onclick="App.produtoManual(\''+ctx+'\')">Não encontrou? Preencher à mão</button>' +
    '</div>';
  }

  function setStatusProduto(ctx, texto, tipo){
    var s = el(ctx+'-status');
    if(!s) return;
    s.textContent = texto || '';
    s.className = tipo === 'erro' ? 'field-erro' : 'hint';
  }

  function buscarSugestoes(q){
    q = String(q||'').trim();
    if(/^\d+$/.test(q)){
      if(q.length < 3) return { list:[], total:0 };
      var out = [], total = 0;
      var exato = lookupByInterno(q);
      if(exato){ out.push(exato); total++; }
      for(var i=0;i<dbSearchList.length;i++){
        var it = dbSearchList[i];
        if(exato && it.barcode === exato.barcode) continue;
        if(it.barcode.indexOf(q) === 0 || (it.codigoInterno && it.codigoInterno.indexOf(q) === 0)){
          total++;
          if(out.length < AC_LIMIT) out.push(it);
          else if(total > 300) break;
        }
      }
      return { list:out, total:total };
    }
    return searchProducts(q, AC_LIMIT);
  }

  function produtoInput(ctx){
    if(acTimer) clearTimeout(acTimer);
    acTimer = setTimeout(function(){ renderSugestoes(ctx); }, 140);
  }

  function renderSugestoes(ctx){
    var box = el(ctx+'-ac'), inp = el(ctx+'-q');
    if(!box || !inp) return;
    var q = inp.value.trim();
    var res = buscarSugestoes(q);
    acState[ctx] = { lista:res.list, idx:res.list.length ? 0 : -1, navegou:false };
    var digitos = /^\d+$/.test(q);
    if(!res.list.length){
      box.innerHTML = '';
      inp.setAttribute('aria-expanded','false');
      if(!q) setStatusProduto(ctx, 'Escaneie, digite o código ou busque pelo nome.');
      else if(digitos) setStatusProduto(ctx, q.length >= 8 ? 'Toque Enter ou saia do campo para buscar este código.' : 'Continue digitando o código.');
      else if(q.length >= 2) setStatusProduto(ctx, 'Nenhum produto com esse nome na base.');
      return;
    }
    setStatusProduto(ctx, '');
    box.innerHTML = '<div class="ac-list">' + res.list.map(function(p, i){
      return '<div class="ac-item" role="option" id="'+ctx+'-op'+i+'" aria-selected="'+(i===0)+'" onmousedown="event.preventDefault()" onclick="App.escolherSugestao(\''+ctx+'\','+i+')">' +
        '<div class="ac-nome">' + esc(p.descricao || '(sem descrição)') + '</div>' +
        '<div class="ac-meta"><span>' + esc(p.barcode) + '</span>' + (p.codigoInterno ? '<span><span class="cod-lbl">Cód. Int.:</span> ' + esc(p.codigoInterno) + '</span>' : '') + '</div>' +
      '</div>';
    }).join('') +
    (res.total > res.list.length ? '<div class="ac-more">Mais ' + (res.total - res.list.length).toLocaleString('pt-BR') + ' resultados. Continue digitando para refinar.</div>' : '') +
    '</div>';
    inp.setAttribute('aria-expanded','true');
    inp.setAttribute('aria-activedescendant', ctx+'-op0');
  }

  function marcarSugestao(ctx){
    var st = acState[ctx];
    var box = el(ctx+'-ac');
    if(!st || !box) return;
    Array.prototype.forEach.call(box.querySelectorAll('.ac-item'), function(n, i){
      n.setAttribute('aria-selected', i === st.idx ? 'true' : 'false');
      if(i === st.idx) n.scrollIntoView({ block:'nearest' });
    });
    var inp = el(ctx+'-q');
    if(inp) inp.setAttribute('aria-activedescendant', ctx+'-op'+st.idx);
  }

  function fecharSugestoes(ctx){
    var box = el(ctx+'-ac');
    if(box) box.innerHTML = '';
    var inp = el(ctx+'-q');
    if(inp){ inp.setAttribute('aria-expanded','false'); inp.removeAttribute('aria-activedescendant'); }
    acState[ctx] = { lista:[], idx:-1 };
  }

  function produtoTecla(e, ctx){
    var st = acState[ctx] || { lista:[], idx:-1 };
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      if(!st.lista.length) return;
      e.preventDefault();
      st.idx = (st.idx + (e.key === 'ArrowDown' ? 1 : -1) + st.lista.length) % st.lista.length;
      st.navegou = true;
      marcarSugestao(ctx);
    } else if(e.key === 'Enter'){
      e.preventDefault();
      confirmarBusca(ctx);
    } else if(e.key === 'Escape'){
      if(st.lista.length){ e.stopPropagation(); fecharSugestoes(ctx); }
    }
  }

  function confirmarBusca(ctx){
    if(acTimer){ clearTimeout(acTimer); acTimer = null; }
    var q = val(ctx+'-q');
    if(!q) return;
    var st = acState[ctx] || { lista:[] };
    if(st.navegou && st.lista[st.idx]){ escolherSugestao(ctx, st.idx); return; }
    if(/^\d+$/.test(q)){
      if(q.length >= 8){ lookupBarcode(ctx, q); return; }
      var ex = lookupByInterno(q);
      if(ex){ lookupBarcode(ctx, ex.barcode); return; }
      fecharSugestoes(ctx);
      setStatusProduto(ctx, 'Cód. Int. ' + q + ' não encontrado na base de produtos.', 'erro');
      return;
    }
    if(!st.lista.length) renderSugestoes(ctx);
    st = acState[ctx];
    if(st.lista.length) escolherSugestao(ctx, st.idx >= 0 ? st.idx : 0);
  }

  function produtoBlur(ctx){
    setTimeout(function(){
      if(formProduto[ctx]) return;
      var inp = el(ctx+'-q');
      if(!inp || document.activeElement === inp) return;
      fecharSugestoes(ctx);
      var q = inp.value.trim();
      if(/^\d{8,14}$/.test(q) && buscaToken[ctx+'-ultimo'] !== q) lookupBarcode(ctx, q);
    }, 200);
  }

  function escolherSugestao(ctx, i){
    var st = acState[ctx];
    var p = st && st.lista[i];
    if(!p) return;
    lookupBarcode(ctx, p.barcode);
  }

  function scanProduto(ctx){
    openScanner(function(text){
      var code = String(text||'').trim();
      var manual = el(ctx+'-manual');
      if(manual && !manual.hidden){
        var b = el(ctx+'-barcode');
        if(b) b.value = code;
        var p = lookupInternal(code);
        if(p && p.descricao && !val(ctx+'-nome')) el(ctx+'-nome').value = p.descricao;
        return;
      }
      var q = el(ctx+'-q');
      if(q) q.value = code;
      lookupBarcode(ctx, code);
    });
  }

  /* Busca por código: base interna primeiro. Se o código não estiver na
     base (ou estiver sem descrição), consulta a base nacional (Cosmos),
     via Apps Script, só para trazer o nome. */
  function lookupBarcode(ctx, code){
    code = String(code||'').trim().replace(/\s+/g,'');
    if(!code) return;
    fecharSugestoes(ctx);
    buscaToken[ctx+'-ultimo'] = code;
    var internal = lookupInternal(code);
    if(!internal){
      var ex = lookupByInterno(code);
      if(ex){ code = ex.barcode; internal = lookupInternal(code); }
    }
    if(internal && internal.descricao){
      selecionarProduto(ctx, { barcode:code, nome:internal.descricao, codigoInterno:internal.codigoInterno||'', origem:'base' });
      return;
    }
    var codInterno = internal ? (internal.codigoInterno || '') : '';
    setStatusProduto(ctx, 'Buscando o código ' + code + ' na base nacional…');
    var token = buscaToken[ctx] = uid();
    fetchProductInfo(code).then(function(info){
      if(buscaToken[ctx] !== token) return; // a pessoa já escolheu outro produto
      if(info && info.nome){
        selecionarProduto(ctx, { barcode:code, nome:info.nome, codigoInterno:codInterno, origem:'cosmos' });
        return;
      }
      produtoManual(ctx, { barcode:code, codigoInterno:codInterno });
      setStatusProduto(ctx, '');
      var box = el(ctx+'-manual');
      if(box && !el(ctx+'-aviso-manual')){
        var p = document.createElement('p');
        p.className = 'hint'; p.id = ctx+'-aviso-manual';
        p.textContent = 'O código ' + code + ' não está na base de produtos nem na base nacional. Confira o número e digite o nome.';
        box.insertBefore(p, box.firstChild);
      }
    });
  }

  function selecionarProduto(ctx, p){
    formProduto[ctx] = p;
    var busca = el(ctx+'-busca'), manual = el(ctx+'-manual'), modo = el(ctx+'-modo'), sel = el(ctx+'-sel');
    if(!sel) return;
    if(busca) busca.hidden = true;
    if(manual) manual.hidden = true;
    if(modo) modo.hidden = true;
    sel.innerHTML = '<div class="prod-sel">' +
      '<div class="info"><div class="n">' + esc(p.nome) + '</div>' +
        '<div class="card-codes"><span>' + esc(p.barcode) + '</span>' + (p.codigoInterno ? '<span><span class="cod-lbl">Cód. Int.:</span> ' + esc(p.codigoInterno) + '</span>' : '') + '</div>' +
        (p.origem === 'cosmos' ? '<p class="hint">Veio da base nacional (Cosmos). Confira o nome.</p>' : '') +
      '</div>' +
      '<div class="prod-acts">' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="App.produtoTrocar(\''+ctx+'\')">Trocar</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="App.produtoEditar(\''+ctx+'\')">Corrigir</button>' +
      '</div></div>';
    var campo = el(ctx+'-campo');
    if(campo){ campo.classList.remove('erro'); var e = campo.querySelector(':scope > .field-erro.din'); if(e) e.parentNode.removeChild(e); }
  }

  function produtoTrocar(ctx){
    formProduto[ctx] = null;
    buscaToken[ctx] = null;
    buscaToken[ctx+'-ultimo'] = null;
    el(ctx+'-sel').innerHTML = '';
    el(ctx+'-manual').hidden = true;
    el(ctx+'-busca').hidden = false;
    var modo = el(ctx+'-modo');
    modo.hidden = false;
    modo.textContent = 'Não encontrou? Preencher à mão';
    modo.setAttribute('onclick', "App.produtoManual('" + ctx + "')");
    var a = el(ctx+'-aviso-manual'); if(a) a.parentNode.removeChild(a);
    var q = el(ctx+'-q');
    q.value = '';
    setStatusProduto(ctx, 'Escaneie, digite o código ou busque pelo nome.');
    try{ q.focus(); }catch(e){}
  }

  function produtoEditar(ctx){
    var p = formProduto[ctx] || {};
    produtoManual(ctx, p);
  }

  function produtoManual(ctx, pre){
    pre = pre || {};
    var q = val(ctx+'-q');
    formProduto[ctx] = null;
    el(ctx+'-sel').innerHTML = '';
    el(ctx+'-busca').hidden = true;
    el(ctx+'-manual').hidden = false;
    el(ctx+'-barcode').value = pre.barcode || (/^\d{8,14}$/.test(q) ? q : '');
    el(ctx+'-nome').value = pre.nome || (q && !/^\d+$/.test(q) ? q.toUpperCase() : '');
    el(ctx+'-codint').value = pre.codigoInterno || '';
    var modo = el(ctx+'-modo');
    modo.hidden = false;
    modo.textContent = 'Voltar para a busca';
    modo.setAttribute('onclick', "App.produtoTrocar('" + ctx + "')");
    var alvo = el(ctx+'-barcode').value ? el(ctx+'-nome') : el(ctx+'-barcode');
    try{ alvo.focus(); }catch(e){}
  }

  /* Devolve o produto do formulário, ou null e marca o erro no campo. */
  function lerProduto(ctx){
    var manual = el(ctx+'-manual');
    if(manual && !manual.hidden){
      var p = { barcode:val(ctx+'-barcode').replace(/\s+/g,''), nome:val(ctx+'-nome'), codigoInterno:val(ctx+'-codint') };
      var ok = true;
      if(!p.barcode){ erroCampo(ctx+'-barcode', 'Informe o código de barras.'); ok = false; }
      if(!p.nome){ erroCampo(ctx+'-nome', 'Informe o nome do produto.'); ok = false; }
      return ok ? p : null;
    }
    if(formProduto[ctx]) return formProduto[ctx];
    erroCampo(ctx+'-q', 'Escolha o produto: escaneie, digite o código ou busque pelo nome.');
    return null;
  }

  function cardCodigos(item){
    return '<div class="card-codes"><span>' + esc(item.barcode) + '</span>' + (item.codigoInterno ? '<span><span class="cod-lbl">Cód. Int.:</span> ' + esc(item.codigoInterno) + '</span>' : '') + '</div>';
  }
  function contextoItem(item, extra){
    return '<div class="context-card"><div class="ctx-top">' +
      '<div style="min-width:0"><div class="ctx-nome">' + esc(item.nome) + '</div>' + cardCodigos(item) + '</div></div>' +
      (extra || '') + '</div>';
  }

  /* ---------- campos de preço ---------- */
  function campoPreco(id, rotulo, valor, extraAttr){
    return '<div class="field"><label for="'+id+'">' + rotulo + '</label><div class="money"><span aria-hidden="true">R$</span>' +
      '<input type="text" id="'+id+'" inputmode="decimal" autocomplete="off" placeholder="0,00" value="' + esc(moneyInput(valor)) + '" ' + (extraAttr||'') + '></div></div>';
  }
  function atualizarDesconto(deId, porId, outId){
    var out = el(outId);
    if(!out) return;
    var de = parseMoney(val(deId)), por = parseMoney(val(porId));
    // só mostra o desconto quando o par é válido; erros aparecem ao enviar
    if(de > 0 && por > 0 && por < de){
      out.textContent = 'Desconto de ' + descontoPct(de, por) + '% (economia de ' + fmtMoney(de - por) + ').';
      return;
    }
    out.textContent = '';
  }
  /* Valida o par De/Por. Devolve {de, por} ou null (com erros marcados). */
  function lerPrecos(deId, porId){
    var deTxt = val(deId), porTxt = val(porId);
    var de = deTxt ? parseMoney(deTxt) : '';
    var por = parseMoney(porTxt);
    var ok = true;
    if(!porTxt){ erroCampo(porId, 'Informe o preço Por.'); ok = false; }
    else if(isNaN(por) || por <= 0){ erroCampo(porId, 'Preço inválido. Use o formato 6,99.'); ok = false; }
    if(deTxt && (isNaN(de) || de <= 0)){ erroCampo(deId, 'Preço inválido. Use o formato 8,99.'); ok = false; }
    else if(deTxt && ok && de <= por){ erroCampo(deId, 'O preço De precisa ser maior que o Por.'); ok = false; }
    return ok ? { de:de, por:por } : null;
  }

  /* ================= EXPOSIÇÃO (itens não expostos) ================= */

  function openNewExpoModal(){
    showModal(
      cabecalhoModal('Avisar item não exposto') +
      campoProdutoHtml('expo') +

  /* ================= ABASTECIMENTO E ESTOQUE =================
     Exposição e placas usam a mesma confirmação, sem foto: produto na
     loja, encontrado no depósito ou não encontrado (vai para a
     conferência do setor de Estoque). Toda resposta pode ser desfeita
     por alguns segundos, para o caso de toque errado. */
  var STATUS_AGUARDA_ABAST = { itensExpo:'pendente', itensPlaca:'pronta' };
  var STATUS_FINAL_ABAST = { itensExpo:'resolvido', itensPlaca:'confirmado' };
  var CAMPOS_FINAL = { itensExpo:['resolvidoEm','resolvidoPor'], itensPlaca:['confirmadoEm','confirmadoPor'] };

  function acharItem(tabela, id){ return lista(tabela).filter(function(i){ return i.id === id; })[0]; }
  function guardarCampos(item, campos){
    var s = {};
    campos.forEach(function(k){ s[k] = (item[k] === undefined || item[k] === null) ? '' : item[k]; });
    return s;
  }
  function desfazer(tabela, id, antes, campos){
    var item = acharItem(tabela, id);
    if(!item) return;
    for(var k in antes) item[k] = antes[k];
    salvarItem(tabela, item, campos);
    render();
    aviso('Desfeito.');
  }

  function confirmarAbastecimento(tabela, id, resultado){
    var item = acharItem(tabela, id);
    if(!item || item.status !== STATUS_AGUARDA_ABAST[tabela]) return;
    var cf = CAMPOS_FINAL[tabela];
    var campos = ['status','resultado', cf[0], cf[1]];
    var antes = guardarCampos(item, campos);
    item.status = STATUS_FINAL_ABAST[tabela];
    item.resultado = resultado;
    item[cf[0]] = nowIso();
    item[cf[1]] = currentUser.nome;
    salvarItem(tabela, item, campos);
    render();
    var msg = tabela === 'itensPlaca'
      ? (resultado === 'loja' ? 'Placa colocada. O produto estava na loja.' : 'Placa colocada. O produto veio do depósito.')
      : (resultado === 'loja' ? 'Confirmado: o produto estava na loja.' : 'Confirmado: produto encontrado no depósito.');
    aviso(msg, null, { rotulo:'Desfazer', fn:function(){ desfazer(tabela, id, antes, campos); } });
  }

  function naoEncontrado(tabela, id){
    var item = acharItem(tabela, id);
    if(!item || item.status !== STATUS_AGUARDA_ABAST[tabela]) return;
    dialogo({
      titulo:'Enviar para a conferência de estoque?',
      texto:'<b>' + esc(item.nome) + '</b> não foi encontrado na loja nem no depósito. O setor de Estoque vai receber o pedido para verificar.',
      campo:{ label:'Onde você procurou? (opcional)', placeholder:'Ex.: seção de higiene e depósito 2' },
      confirmar:'Enviar ao estoque', cancelar:'Voltar',
      onConfirmar:function(obs){
        var campos = ['status','enviadoEstoqueEm','enviadoEstoquePor','obsAbastecimento'];
        var antes = guardarCampos(item, campos);

  function lerPlanilhaBruta(file){
    return new Promise(function(resolve, reject){
      if(typeof XLSX === 'undefined'){ reject(new Error('XLSX indisponível')); return; }
      var reader = new FileReader();
      reader.onload = function(e){
        try{
          var wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true });
          var sheet = wb.Sheets[wb.SheetNames[0]];
          resolve(XLSX.utils.sheet_to_json(sheet, { defval:'', raw:true }));
        }catch(err){ reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }

  function campoImportPlaca(h){
    var n = normalizeHeader(h);
    if(!n) return null;
    if(n === 'por' || n.indexOf('precopor') !== -1 || n === 'precooferta' || n === 'oferta' || n.indexOf('novopreco') !== -1 || n.indexOf('preconovo') !== -1 || n.indexOf('precopromo') !== -1) return 'precoPor';
    if(n === 'de' || n.indexOf('precode') !== -1 || n.indexOf('precoatual') !== -1 || n.indexOf('preconormal') !== -1 || n.indexOf('precoregular') !== -1 || n.indexOf('precoantigo') !== -1) return 'precoDe';
    if(n.indexOf('validade') !== -1 || n.indexOf('validoate') !== -1 || n.indexOf('vigencia') !== -1 || n.indexOf('datafim') !== -1 || n.indexOf('fimoferta') !== -1) return 'validade';
    if(n.indexOf('meuoriundi') !== -1 || n.indexOf('fidelidade') !== -1 || n.indexOf('clube') !== -1) return 'fidelidade';
    if(n.indexOf('observ') === 0 || n === 'obs') return 'observacao';
    var k = matchHeader(h);
    if(k === 'barcode' || k === 'interno' || k === 'descricao') return k;
    return null;
  }

  function parseDataPlanilha(v){
    if(v === '' || v === null || v === undefined) return '';
    if(v instanceof Date){
      if(isNaN(v.getTime())) return null;
      var t = new Date(v.getTime() + 6*3600000);  // corrige o arredondamento de fuso do Excel
      return t.getFullYear() + '-' + pad2(t.getMonth()+1) + '-' + pad2(t.getDate());
    }
    if(typeof v === 'number' && typeof XLSX !== 'undefined' && XLSX.SSF){
      var p = XLSX.SSF.parse_date_code(v);
      if(p && p.y) return p.y + '-' + pad2(p.m) + '-' + pad2(p.d);
      return null;
    }
    var s = String(v).trim(), m;
    if((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))){
      var y = Number(m[3]); if(y < 100) y += 2000;
      var mes = Number(m[2]), dia = Number(m[1]);
      if(mes < 1 || mes > 12 || dia < 1 || dia > 31) return null;
      return y + '-' + pad2(mes) + '-' + pad2(dia);
    }
    if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1] + '-' + m[2] + '-' + m[3];
    return null;
  }

  function simNao(v){
    var n = normalizeHeader(v);
    return ['sim','s','x','1','true','yes','y','meuoriundi','fidelidade'].indexOf(n) !== -1;
  }

  function textoCelula(v){
    if(v === null || v === undefined) return '';
    if(typeof v === 'number') return String(Math.round(v) === v ? v : v);
    return String(v).trim();
  }

  function processarLinhasPlacas(rows){
    if(!rows || !rows.length) return { erro:'A planilha está vazia.' };
    var campos = {};
    Object.keys(rows[0]).forEach(function(h){
      var c = campoImportPlaca(h);
      if(c && !campos[c]) campos[c] = h;
    });
    if(!campos.barcode && !campos.interno) return { erro:'Não encontramos a coluna de código de barras nem a de código interno.' };
    if(!campos.precoPor) return { erro:'Não encontramos a coluna de preço Por.' };

    var abertos = {};
    daFilial(itemsPlaca, activeFilial).forEach(function(i){ if(i.status === 'pendente' || i.status === 'pronta') abertos[i.barcode] = true; });
    var ok = [], problemas = [], vistos = {};
    rows.forEach(function(r, i){
      var linha = i + 2;
      var bc = campos.barcode ? textoCelula(r[campos.barcode]).replace(/\s+/g,'').replace(/\.0+$/,'') : '';
      var ci = campos.interno ? textoCelula(r[campos.interno]) : '';
      var desc = campos.descricao ? textoCelula(r[campos.descricao]) : '';
      var porBruto = r[campos.precoPor];
      if(!bc && !ci && !desc && (porBruto === '' || porBruto === null || porBruto === undefined)) return; // linha vazia
      var base = bc ? lookupInternal(bc) : null;
      if(!base && ci){
        var ex = lookupByInterno(ci);
        if(ex){ bc = ex.barcode; base = lookupInternal(bc); }
      }
      var nome = (base && base.descricao) || desc;
      var por = parseMoney(porBruto);
      var deBruto = campos.precoDe ? r[campos.precoDe] : '';
      var de = (deBruto === '' || deBruto === null || deBruto === undefined) ? NaN : parseMoney(deBruto);
      var validade = campos.validade ? parseDataPlanilha(r[campos.validade]) : '';
      var motivo = '';
      if(!bc) motivo = ci ? 'Código interno não está na base' : 'Sem código de barras';
      else if(!nome) motivo = 'Produto fora da base e sem descrição';
      else if(!(por > 0)) motivo = 'Sem preço Por válido';
      else if(!isNaN(de) && de > 0 && de <= por) motivo = 'Preço De menor ou igual ao Por';
      else if(validade === null) motivo = 'Validade em formato desconhecido';
      else if(vistos[bc]) motivo = 'Repetido na planilha';
      else if(abertos[bc]) motivo = 'Já tem placa em aberto';
      if(motivo){
        problemas.push({ linha:linha, ref:bc || ci || desc || '—', nome:nome, motivo:motivo });
        return;
      }
      vistos[bc] = true;
      ok.push({
        barcode:bc, nome:nome, codigoInterno:(base && base.codigoInterno) || ci || '',
        precoDe:(!isNaN(de) && de > 0) ? de : '', precoPor:por, validade:validade || '',
        fidelidade:(campos.fidelidade && simNao(r[campos.fidelidade])) ? '1' : '',
        observacao:campos.observacao ? textoCelula(r[campos.observacao]) : ''
      });
    });
    return { ok:ok, problemas:problemas };
  }

  function handlePlacasFile(evt){
    var file = evt.target.files && evt.target.files[0];
    evt.target.value = '';
    if(!file) return;
    var box = el('imp-placas');
    box.innerHTML = '<div class="lookup-status">Lendo planilha…</div>';
    lerPlanilhaBruta(file).then(function(rows){
      var r = processarLinhasPlacas(rows);
      if(r.erro){ importPlacas = null; box.innerHTML = '<div class="warn-box">' + esc(r.erro) + ' Confira os nomes das colunas ou use o modelo.</div>'; return; }
      importPlacas = r.ok;
      var html = '<div class="imp-resumo"><div><b>' + r.ok.length + '</b>' + (r.ok.length === 1 ? 'pronto para enviar' : 'prontos para enviar') + '</div>' +
        '<div><b>' + r.problemas.length + '</b>' + (r.problemas.length === 1 ? 'com problema (fica de fora)' : 'com problema (ficam de fora)') + '</div></div>';
      if(r.problemas.length){
        html += '<h4 class="secao-tit">Linhas com problema</h4><div class="tabela-rolavel"><table class="import-table"><tr><th>Linha</th><th>Código</th><th>Motivo</th></tr>' +
          r.problemas.slice(0, 50).map(function(p){
            return '<tr><td>' + p.linha + '</td><td class="mono">' + esc(p.ref) + '</td><td>' + esc(p.motivo) + (p.nome ? '<br><span class="hint">' + esc(p.nome) + '</span>' : '') + '</td></tr>';
          }).join('') + '</table></div>' +
          (r.problemas.length > 50 ? '<p class="hint">Mostrando 50 de ' + r.problemas.length + '.</p>' : '');
      }
      if(r.ok.length){
        html += '<h4 class="secao-tit">Prévia</h4><div class="tabela-rolavel"><table class="import-table"><tr><th>Produto</th><th>De</th><th>Por</th><th>Tipo</th></tr>' +
          r.ok.slice(0, 8).map(function(p){
            return '<tr><td>' + esc(p.nome) + '</td><td style="white-space:nowrap">' + (p.precoDe ? fmtMoney(p.precoDe) : '—') + '</td><td style="white-space:nowrap"><b>' + fmtMoney(p.precoPor) + '</b></td><td>' + (p.fidelidade ? 'Meu Oriundi' : 'Oferta') + '</td></tr>';
          }).join('') + '</table></div>' +
          (r.ok.length > 8 ? '<p class="hint">E mais ' + (r.ok.length - 8) + '.</p>' : '') +
          '<button type="button" class="btn btn-primary btn-block" style="margin-top:16px" onclick="App.confirmarImportPlacas()">Enviar ' + plural(r.ok.length, 'pedido', 'pedidos') + ' ao marketing</button>';
      }
      box.innerHTML = html;
    }).catch(function(){
      importPlacas = null;
      box.innerHTML = '<div class="warn-box">Não foi possível ler esse arquivo. Confira se é um .xlsx ou .csv válido.</div>';
    });
  }

  function confirmarImportPlacas(){
    if(!importPlacas || !importPlacas.length) return;
    var agora = nowIso();
    var novos = importPlacas.map(function(p){
      return {
        id:uid(), filial:activeFilial, barcode:p.barcode, nome:p.nome, codigoInterno:p.codigoInterno,
        infoPlaca:'', observacao:p.observacao, origem:'planilha', status:'pendente', criadoEm:agora, criadoPor:currentUser.nome,
        precoDe:p.precoDe, precoPor:p.precoPor, validade:p.validade, fidelidade:p.fidelidade
      };
    });
    itemsPlaca = novos.concat(itemsPlaca);
    salvarItens('itensPlaca', novos);
    importPlacas = null;
    closeModal();
    render();
    aviso(plural(novos.length, 'pedido de placa enviado', 'pedidos de placa enviados') + ' ao marketing.');
  }
