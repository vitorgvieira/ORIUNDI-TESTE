<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Giro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F5F5F6;
    --surface:#FFFFFF;
    --surface-alt:#EFEFF1;
    --ink:#1C1C1E;
    --ink-soft:#48484D;
    --ink-faint:#67676B;
    --line:#E3E3E6;
    --line-strong:#CDCDD2;
    --brand:#F40000;        /* vermelho da marca: logo, sublinhado da aba, pontos de alerta */
    --red:#C40000;          /* vermelho para texto e botões (contraste AA) */
    --red-soft:#FDE7E7;
    --amber:#C9700A;
    --amber-ink:#8A4B00;
    --amber-soft:#FBEAD2;
    --green:#008F3D;
    --green-ink:#00702F;
    --green-soft:#DFF3E6;
    --font-display:'Poppins','Inter',system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;
    -webkit-font-smoothing:antialiased;min-height:100vh;-webkit-tap-highlight-color:transparent;
  }
  body.sem-rolagem{overflow:hidden;}
  button,input,select,textarea{font-family:inherit;}
  [hidden]{display:none !important;}
  :focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  #app{max-width:1120px;margin:0 auto;}

  /* ---------- cabeçalho ---------- */
  header.top{background:var(--surface);padding:10px 16px 0 16px;}
  .brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;}
  .brand-lockup{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-logo{height:30px;width:auto;flex-shrink:0;}
  .app-name{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:26px;padding-left:10px;border-left:1px solid var(--line);}
  .conta-btn{
    display:flex;align-items:center;gap:10px;min-height:44px;max-width:60%;padding:4px 4px 4px 12px;
    border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:right;
  }
  .conta-btn:hover{background:var(--surface-alt);}
  .conta-txt{display:flex;flex-direction:column;min-width:0;}
  .conta-txt .nome{font-size:13.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conta-txt .sub{font-size:12px;color:var(--ink-faint);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;}

  .filial-seg{display:flex;gap:4px;background:var(--surface-alt);border-radius:11px;padding:3px;margin-top:10px;max-width:440px;}
  .filial-seg button{
    flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--ink-soft);
    font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  }
  .filial-seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10);}
  .seg-n{font-size:12px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface-alt);color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;}
  .filial-seg button[aria-checked="true"] .seg-n{background:var(--ink);color:#fff;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);display:inline-block;flex-shrink:0;}

  /* ---------- abas (fixas no topo ao rolar) ---------- */
  .tabs-wrap{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;}
  .tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:1 0 auto;min-height:50px;padding:0 10px;background:none;border:0;border-bottom:3px solid transparent;
    font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--ink-faint);
    display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;cursor:pointer;
  }
  .tab-btn[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);}
  .tab-n{font-family:var(--font-body);font-size:12px;font-weight:600;min-width:21px;height:21px;padding:0 6px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-alt);color:var(--ink-soft);}
  .tab-n.acao{background:var(--red);color:#fff;}
  @media(min-width:700px){ .tabs{gap:8px;} .tab-btn{flex:0 0 auto;padding:0 14px;} }

  /* ---------- avisos ---------- */
  .notice{margin:12px 16px 0 16px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.45;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .notice-info{background:var(--amber-soft);color:var(--amber-ink);}
  .notice-urgente{background:var(--red-soft);color:var(--red);font-weight:500;}
  .notice .txt{flex:1 1 220px;}
  .notice .btn{flex-shrink:0;}

  /* ---------- conteúdo ---------- */
  main{padding:16px 16px 40px 16px;}
  body.com-sel main{padding-bottom:110px;}
  .acoes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  @media(max-width:640px){ .acoes .btn{flex:1 1 100%;} }
  .filtros{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px -16px;padding:2px 16px;}
  .filtros::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink-soft);font-weight:600;font-size:13.5px;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;}
  .chip-n{font-size:12px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface-alt);color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;}
  .chip[aria-pressed="true"] .chip-n{background:rgba(255,255,255,.22);color:#fff;}
  .sel-todas{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--ink-soft);cursor:pointer;margin-bottom:6px;}
  .check{width:22px;height:22px;accent-color:var(--ink);margin:0;flex-shrink:0;cursor:pointer;}

  /* ---------- cards ---------- */
  .card-list{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start;}
  @media(min-width:900px){ .card-list{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media(min-width:1280px){ .card-list{grid-template-columns:repeat(3,minmax(0,1fr));} }
  .card{
    background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bar,var(--line));
    border-radius:var(--radius);padding:14px 16px 16px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;
  }
  .card.st-aguardando{--bar:var(--amber);}
  .card.st-urgente{--bar:var(--red);}
  .card.st-concluido{--bar:var(--green);}
  .card.selecionado{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
  .card-status{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .card-top{display:flex;gap:12px;align-items:flex-start;min-width:0;}
  .card-sel{display:flex;align-items:center;justify-content:center;width:40px;height:56px;margin:0 -4px 0 -8px;flex-shrink:0;cursor:pointer;}
  .card-info{flex:1;min-width:0;}
  .card-name{font-family:var(--font-body);font-weight:600;font-size:15px;line-height:1.3;margin:0;overflow-wrap:anywhere;}
  .card-codes{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-faint);}
  .card-codes span{white-space:nowrap;}
  .cod-lbl{font-family:var(--font-body);font-size:12.5px;font-weight:500;}
  .card-obs{font-size:14px;color:var(--ink-soft);line-height:1.45;margin:6px 0 0 0;overflow-wrap:anywhere;}
  .card-meta{font-size:13px;color:var(--ink-faint);line-height:1.45;}
  .card-meta b{color:var(--ink-soft);font-weight:600;}
  .card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  @media(max-width:640px){ .card-actions .btn{flex:1 1 100%;min-height:46px;} }
  .thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--line);background:var(--surface-alt);}
  .thumb-placeholder{width:56px;height:56px;border-radius:10px;flex-shrink:0;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);border:1px solid var(--line);}
  .abast{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:2px;}
  .abast-tit{grid-column:1 / -1;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .abast .btn{min-height:52px;width:100%;padding:6px 10px;text-align:center;}
  .abast .btn-alerta, .abast .btn-largo{grid-column:1 / -1;}
  .btn-alerta{background:var(--red-soft);color:var(--red);}
  .btn-alerta:hover{background:#FAD4D4;}
  .nota{background:var(--green-soft);color:var(--green-ink);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;}
  .nota span{display:block;font-size:12.5px;margin-top:2px;}
  .prova{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink-soft);font-size:13px;text-decoration:underline;min-height:44px;}
  .prova img{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);}

  .preco{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:8px;}
  .preco-de{font-size:13.5px;color:var(--ink-faint);}
  .preco-por{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.1;color:var(--ink);}
  .preco-lbl{font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--ink-faint);margin-right:2px;}
  .preco-off{font-size:12.5px;font-weight:600;color:var(--red);background:var(--red-soft);padding:2px 7px;border-radius:6px;}

  .tag{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:6px;font-size:12.5px;font-weight:600;line-height:1.2;white-space:nowrap;}
  .tag-aguardando{background:var(--amber-soft);color:var(--amber-ink);}
  .tag-urgente{background:var(--red-soft);color:var(--red);}
  .tag-concluido{background:var(--green-soft);color:var(--green-ink);}
  .tag-neutro{background:var(--surface-alt);color:var(--ink-soft);}
  .tag-fid{background:var(--surface);color:var(--green-ink);box-shadow:inset 0 0 0 1.5px var(--green);}

  .empty{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .empty h3{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink);margin:0 0 6px 0;}
  .empty p{font-size:14px;line-height:1.55;max-width:360px;margin:0 auto;}

  /* ---------- botões ---------- */
  .btn{
    font-weight:600;font-size:14px;border-radius:10px;border:0;min-height:42px;padding:0 16px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2;
    transition:background .15s,color .15s,box-shadow .15s;
  }
  .btn svg{flex-shrink:0;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:#000;}
  .btn-outline{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong);}
  .btn-outline:hover{background:var(--surface-alt);}
  .btn-ghost{background:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{background:var(--surface-alt);color:var(--ink);}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-danger:hover{background:#A00000;}
  .btn-sm{min-height:36px;font-size:13.5px;padding:0 12px;}
  .btn-block{width:100%;}
  .btn[disabled]{background:var(--surface-alt);color:var(--ink-faint);box-shadow:none;cursor:not-allowed;}
  .btn-link{background:none;border:0;padding:10px 2px;min-height:44px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;font-size:14px;font-weight:500;cursor:pointer;}
  .btn-link:hover{color:var(--ink);}

  /* ---------- formulários ---------- */
  .field{margin-bottom:16px;}
  .field > label, .lbl{display:block;font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=password], .field textarea, .select{
    width:100%;min-height:48px;font-size:16px;padding:10px 12px;border-radius:10px;
    border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);
  }
  .field textarea{min-height:76px;resize:vertical;line-height:1.4;}
  .field input:focus, .field textarea:focus, .select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(28,28,30,.12);}
  .field input[readonly]{background:var(--surface-alt);}
  .field.erro input, .field.erro textarea, .field.erro .select{border-color:var(--red);}
  .field-erro{color:var(--red);font-size:13.5px;font-weight:500;margin:6px 0 0 0;}
  .hint{font-size:13px;color:var(--ink-faint);margin:6px 0 0 0;line-height:1.45;}
  .row2{display:flex;gap:10px;}
  .row2 > .field{flex:1;min-width:0;}
  .money{position:relative;}
  .money > span{position:absolute;left:12px;top:0;height:48px;display:flex;align-items:center;color:var(--ink-faint);font-size:15px;pointer-events:none;}
  .field .money input{padding-left:38px;}
  .desconto{font-size:13.5px;color:var(--ink-soft);margin:-6px 0 16px 0;min-height:18px;}
  .barcode-row{display:flex;gap:8px;align-items:flex-start;}
  .barcode-row > .ac-wrap, .barcode-row > input{flex:1;min-width:0;}
  .barcode-row input{font-family:var(--font-body);}
  .scan-btn{flex-shrink:0;width:48px;height:48px;border-radius:10px;border:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .lookup-status{font-size:13.5px;color:var(--ink-soft);margin-top:8px;display:flex;align-items:center;gap:7px;}
  .lookup-status.ok{color:var(--green-ink);font-weight:500;}
  .warn-box{background:var(--red-soft);color:var(--red);font-size:13.5px;padding:10px 12px;border-radius:9px;margin-top:8px;line-height:1.45;}
  .checkbox-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;min-height:40px;color:var(--ink);}
  .photo-input-row{display:flex;align-items:center;gap:12px;}
  .file-btn{position:relative;overflow:hidden;}
  .file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;}
  .context-card{background:var(--surface-alt);border-radius:10px;padding:12px;margin-bottom:16px;font-size:14px;color:var(--ink-soft);line-height:1.5;}
  .context-card .ctx-top{display:flex;gap:12px;align-items:center;margin-bottom:8px;}
  .context-card .ctx-nome{font-weight:600;color:var(--ink);}
  .context-card .card-codes{margin-top:2px;}

  .prod-sel{display:flex;gap:12px;align-items:center;background:var(--surface-alt);border-radius:10px;padding:10px;}
  .prod-sel .info{flex:1;min-width:0;}
  .prod-sel .n{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere;}
  .prod-sel .hint{margin-top:4px;}
  .prod-acts{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .manual{border-left:3px solid var(--line);padding-left:12px;margin-top:4px;}

  .tipo-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .tipo-opt{border:1.5px solid var(--line-strong);border-radius:10px;padding:10px 12px;text-align:left;background:var(--surface);cursor:pointer;min-height:58px;color:var(--ink);}
  .tipo-opt b{display:block;font-size:14.5px;}
  .tipo-opt span{display:block;font-size:12.5px;color:var(--ink-faint);margin-top:2px;line-height:1.3;}
  .tipo-opt[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}

  .ac-wrap{position:relative;}
  .ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.16);max-height:320px;overflow-y:auto;}
  .ac-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);}
  .ac-item:last-child{border-bottom:0;}
  .ac-item:hover, .ac-item[aria-selected="true"]{background:var(--surface-alt);}
  .ac-nome{font-size:14px;line-height:1.3;}
  .ac-meta{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);margin-top:3px;}
  .ac-more{padding:9px 12px;font-size:13px;color:var(--ink-faint);background:var(--surface-alt);}

  .import-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  .import-table th{text-align:left;color:var(--ink-faint);font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);}
  .import-table td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top;}
  .import-table td.mono{font-family:var(--font-mono);font-size:12.5px;white-space:nowrap;}
  .imp-resumo{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;}
  .imp-resumo div{flex:1 1 140px;background:var(--surface-alt);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink-soft);}
  .imp-resumo b{display:block;font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--ink);}
  .tabela-rolavel{overflow-x:auto;margin:0 -2px;}

  /* ---------- janela (modal) ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,20,22,.5);display:none;align-items:flex-end;justify-content:center;z-index:100;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--surface);width:100%;max-width:540px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:0 18px calc(24px + env(safe-area-inset-bottom)) 18px;outline:none;}
  @media(min-width:600px){ .modal-backdrop{align-items:center;padding:20px;} .modal{border-radius:16px;max-height:90vh;} }
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--surface);padding:14px 0 10px 0;margin-bottom:6px;z-index:5;}
  .modal-head h3{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.3;margin:9px 0 0 0;}
  .icon-btn{width:44px;height:44px;flex-shrink:0;border:0;border-radius:10px;background:none;color:var(--ink-soft);font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{background:var(--surface-alt);color:var(--ink);}
  .foto-grande{width:100%;border-radius:10px;display:block;}

  /* ---------- diálogo de confirmação ---------- */
  .dialog-backdrop{position:fixed;inset:0;background:rgba(20,20,22,.55);display:none;align-items:center;justify-content:center;z-index:250;padding:16px;}
  .dialog-backdrop.open{display:flex;}
  .dialog{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:420px;outline:none;}
  .dialog h3{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.3;margin:0 0 8px 0;}
  .dialog p.txt{font-size:15px;color:var(--ink-soft);line-height:1.5;margin:0 0 16px 0;}
  .dialog .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  @media(max-width:480px){ .dialog .acts{flex-direction:column-reverse;} .dialog .acts .btn{width:100%;min-height:46px;} }

  /* ---------- barra de seleção e avisos rápidos ---------- */
  .sel-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ink);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom)) 16px;display:none;}
  .sel-bar.on{display:block;}
  .sel-bar .in{max-width:1088px;margin:0 auto;display:flex;align-items:center;gap:8px;}
  .sel-bar .txt{flex:1;font-size:14.5px;font-weight:600;}
  .sel-bar .btn-primary{background:#fff;color:var(--ink);}
  .sel-bar .btn-primary:hover{background:#E8E8EA;}
  .sel-bar .btn-ghost{color:#fff;}
  .sel-bar .btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff;}
  .toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px;}
  body.com-sel .toasts{bottom:calc(84px + env(safe-area-inset-bottom));}
  .toast{background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;font-size:14.5px;line-height:1.4;max-width:460px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:auto;transition:opacity .25s,transform .25s;}
  .toast.erro{background:var(--red);}
  .toast{display:flex;align-items:center;gap:14px;}
  .toast-acao{flex-shrink:0;background:none;border:0;color:#fff;font-weight:700;font-size:14.5px;text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 4px;cursor:pointer;}
  .toast.sai{opacity:0;transform:translateY(8px);}

  /* ---------- telas de entrada ---------- */
  .auth-screen{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;overflow-y:auto;}
  .auth-screen.open{display:flex;}
  .auth-card{background:var(--surface);border-radius:16px;padding:28px 22px;width:100%;max-width:400px;border:1px solid var(--line);margin:auto;}
  .auth-logo{display:flex;justify-content:center;margin-bottom:18px;}
  .auth-logo img{height:40px;}
  .auth-title{font-family:var(--font-display);font-weight:600;font-size:21px;text-align:center;margin:0 0 6px 0;}
  .auth-sub{font-size:14.5px;color:var(--ink-soft);text-align:center;margin:0 0 20px 0;line-height:1.5;}
  .auth-dicas{font-size:14px;color:var(--ink-soft);line-height:1.5;padding-left:18px;margin:0 0 20px 0;}
  .auth-dicas li{margin-bottom:8px;}
  .auth-error{background:var(--red-soft);color:var(--red);font-size:14px;padding:10px 12px;border-radius:9px;margin-bottom:14px;line-height:1.45;}
  .auth-tec{font-size:13px;color:var(--ink-faint);margin-top:14px;}
  .auth-tec summary{cursor:pointer;min-height:32px;}
  .auth-tec code{font-family:var(--font-mono);word-break:break-all;}
  .auth-centro{text-align:center;}
  .spinner{width:32px;height:32px;border-radius:50%;margin:8px auto 0 auto;border:3px solid var(--surface-alt);border-top-color:var(--ink);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .pin-input{letter-spacing:.4em;text-align:center;font-family:var(--font-mono) !important;font-size:20px !important;}

  /* ---------- conta e usuários ---------- */
  .conta-info{background:var(--surface-alt);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  .conta-info b{display:block;font-size:16px;}
  .conta-info span{font-size:14px;color:var(--ink-soft);}
  .menu-lista{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px;}
  .menu-item{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;text-align:left;}
  .menu-item:last-child{border-bottom:0;}
  .menu-item:hover{background:var(--surface-alt);}
  .menu-n{font-size:13.5px;color:var(--ink-faint);font-weight:500;}
  .sync-info{font-size:14px;color:var(--ink-soft);margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .user-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .user-row:last-child{border-bottom:0;}
  .u-name{font-weight:600;font-size:14.5px;}
  .u-role{font-size:13px;color:var(--ink-faint);}
  .u-actions{display:flex;gap:4px;}
  .secao-tit{font-family:var(--font-display);font-weight:600;font-size:16px;margin:18px 0 10px 0;}

  /* ---------- leitor de código ---------- */
  .scan-backdrop{position:fixed;inset:0;background:rgba(20,20,22,.82);z-index:120;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
  .scan-backdrop.open{display:flex;}
  .scan-panel{background:var(--surface);border-radius:14px;padding:12px 14px 14px 14px;width:100%;max-width:460px;}
  .scan-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display);font-weight:600;font-size:16px;margin-bottom:8px;}
  .scan-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  #scanner-box{border-radius:10px;overflow:hidden;background:#000;min-height:200px;}
  #scanner-box video{width:100%!important;display:block;border-radius:10px;}

  /* ---------- pré-visualização da placa ---------- */
  .prev-frame{width:100%;aspect-ratio:205/102;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-alt);}
  .prev-frame iframe{width:100%;height:100%;border:0;display:block;}
  .prev-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .prev-pos{font-size:14px;color:var(--ink-soft);font-weight:600;}
  .prev-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0 12px 0;}
  .preco-fixo{background:var(--surface-alt);border-radius:10px;padding:10px 12px;margin-bottom:16px;}
  .preco-fixo .preco{margin-top:2px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation-duration:0s !important;}
  }
</style>
</head>

  /* ---------- utilidades ---------- */
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function el(id){ return document.getElementById(id); }
  function val(id){ var e = el(id); return e ? String(e.value||'').trim() : ''; }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function nowIso(){ return new Date().toISOString(); }
  function pad2(n){ return (n<10?'0':'') + n; }
  function ts(v){ var t = new Date(v).getTime(); return isNaN(t) ? 0 : t; }
  function fmtDateTime(iso){
    if(!iso) return '—';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('pt-BR') + ' às ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function dataLocal(v){
    var s = String(v||'').slice(0,10);
    return new Date(s + 'T00:00:00');
  }
  function fmtDate(v){
    if(!v) return '—';
    var d = dataLocal(v);
    if(isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('pt-BR');
  }
  function daysUntil(v){
    var target = dataLocal(v);
    if(isNaN(target.getTime())) return 9999;
    var today = new Date(); today.setHours(0,0,0,0);
    return Math.round((target - today) / 86400000);
  }
  function prazoTexto(d){
    if(d === 9999) return 'Sem data';
    if(d < -1) return 'Venceu há ' + (-d) + ' dias';
    if(d === -1) return 'Venceu ontem';
    if(d === 0) return 'Vence hoje';
    if(d === 1) return 'Vence amanhã';
    return 'Vence em ' + d + ' dias';
  }
  function fmtMoney(v){
    var n = Number(v);
    if(v === '' || v === null || v === undefined || isNaN(n)) return '—';
    return 'R$ ' + n.toFixed(2).replace('.',',');
  }
  /* Aceita "6,99", "6.99", "R$ 1.234,50" e números. Devolve NaN se não for preço. */
  function parseMoney(v){
    if(v === null || v === undefined) return NaN;
    if(typeof v === 'number') return isNaN(v) ? NaN : Math.round(v*100)/100;
    var t = String(v).replace(/R\$|\s/gi,'');
    if(!t) return NaN;
    if(t.indexOf(',') !== -1) t = t.replace(/\./g,'').replace(',','.');
    if(!/^\d+(\.\d+)?$/.test(t)) return NaN;
    return Math.round(Number(t)*100)/100;
  }
  function moneyInput(v){
    var n = Number(v);
    if(v === '' || v === null || v === undefined || isNaN(n) || n <= 0) return '';
    return n.toFixed(2).replace('.',',');
  }
  function descontoPct(de, por){
    de = Number(de); por = Number(por);
    if(!(de > 0) || !(por > 0) || por >= de) return 0;
    return Math.round((1 - por/de) * 100);
  }
  function iniciais(nome){
    var p = String(nome||'').trim().split(/\s+/).filter(Boolean);
    if(!p.length) return '?';
    return (p[0][0] + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase();
  }
  function plural(n, um, varios){ return n + ' ' + (n === 1 ? um : varios); }

  }
  function plusIcon(){
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

  function loadApiUrl(){
    try{
      var v = localStorage.getItem('giro-api-url');
      if(v) SHEETS_API_URL = v;
    }catch(e){ /* armazenamento indisponível neste navegador */ }
  }
  function saveApiUrl(url){
    SHEETS_API_URL = url;
    try{ localStorage.setItem('giro-api-url', url); }catch(e){}
  }
  function clearApiUrl(){
    SHEETS_API_URL = '';
    try{ localStorage.removeItem('giro-api-url'); }catch(e){}
  }
  function apiUrl(params){
    var q = Object.keys(params).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    return SHEETS_API_URL + (SHEETS_API_URL.indexOf('?') === -1 ? '?' : '&') + q;
  }
  function apiGet(action, extra){
    var params = { action:action };
    if(extra) for(var k in extra) params[k] = extra[k];
    return fetch(apiUrl(params)).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data){
      if(data && data.ok === false) throw new Error(data.error || 'Erro na planilha');
      return data;
    });
  }
  function apiPost(action, data){
    return fetch(SHEETS_API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:action, data:data })
    }).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(out){
      if(out && out.ok === false) throw new Error(out.error || 'Erro na planilha');
      return out;
    });
  }

  /* ---------- sincronização ----------
     Toda alteração entra numa fila guardada neste aparelho (localStorage)
     e só sai dela depois que a planilha confirma o recebimento. Se a rede
     cair, nada se perde: o Giro tenta de novo sozinho, inclusive depois
     de fechar e abrir a página.

     Com o script novo (versão 2), cada alteração grava só o item mexido,
     com trava no servidor, então duas pessoas salvando ao mesmo tempo não
     apagam o trabalho uma da outra. Com o script antigo, o app continua
     funcionando no modo anterior (regrava a tabela inteira). */
  var TABELAS = ['usuarios','itensExpo','itensVal','itensPlaca'];
  var ACAO_LEGADO = { usuarios:'saveUsuarios', itensExpo:'saveItensExpo', itensVal:'saveItensVal', itensPlaca:'saveItensPlaca' };
  var backendVersao = 1;
  var fila = [];
  var enviando = false;
  var envioFalhou = false;
  var syncSeq = 0;
  var reenvioTimer = null;

  function lista(t){
    if(t === 'usuarios') return users;
    if(t === 'itensExpo') return itemsExpo;
    if(t === 'itensVal') return itemsVal;
    return itemsPlaca;
  }
  function definirLista(t, arr){
    if(t === 'usuarios') users = arr;
    else if(t === 'itensExpo') itemsExpo = arr;
    else if(t === 'itensVal') itemsVal = arr;
    else itemsPlaca = arr;
  }
  function carregarFila(){
    try{ fila = JSON.parse(localStorage.getItem('giro-fila') || '[]') || []; }catch(e){ fila = []; }
    if(!Array.isArray(fila)) fila = [];
  }
  function gravarFila(){
    try{ localStorage.setItem('giro-fila', JSON.stringify(fila)); }catch(e){ /* sem espaço: a fila segue em memória */ }
  }
  function copiaRasa(o){
    var c = {};
    for(var k in o){ if(Object.prototype.hasOwnProperty.call(o,k)) c[k] = o[k]; }
    return c;
  }

  /* Registra itens novos ou alterados. `campos` (opcional) limita o envio
     aos campos que mudaram, para não reenviar fotos à toa. */
  function salvarItens(tabela, itens, campos){
    itens.forEach(function(item){
      var dado;
      if(campos){
        dado = { id:item.id };
        campos.forEach(function(k){ dado[k] = (item[k] === undefined || item[k] === null) ? '' : item[k]; });
      } else {
        dado = copiaRasa(item);
      }
      fila.push({ uid:uid(), tabela:tabela, tipo:'upsert', id:item.id, item:dado, parcial:!!campos });
    });
    gravarFila();
    enviarFila();
  }
  function salvarItem(tabela, item, campos){ salvarItens(tabela, [item], campos); }
  function removerItem(tabela, id){
    fila.push({ uid:uid(), tabela:tabela, tipo:'delete', id:id });
    gravarFila();
    enviarFila();
  }

  /* Reaplica a fila pendente sobre dados recém-chegados da planilha, para
     que uma alteração ainda não confirmada não "volte" na tela. */
  function aplicarFilaEm(dados){
    fila.forEach(function(op){
      var arr = dados[op.tabela];
      if(!arr) return;
      var idx = -1;
      for(var i=0;i<arr.length;i++){ if(String(arr[i].id) === String(op.id)){ idx = i; break; } }
      if(op.tipo === 'delete'){ if(idx !== -1) arr.splice(idx,1); return; }
      if(idx !== -1){
        var m = copiaRasa(arr[idx]);
        for(var k in op.item) m[k] = op.item[k];
        arr[idx] = m;
      } else if(!op.parcial){
        arr.unshift(copiaRasa(op.item));
      }
    });
  }

  function enviarFila(){
    if(enviando || !fila.length || !SHEETS_API_URL) return;
    enviando = true;
    if(reenvioTimer){ clearTimeout(reenvioTimer); reenvioTimer = null; }
    var lote = fila.slice(0, 25);
    var envio;
    if(backendVersao >= 2){
      envio = apiPost('aplicarOps', lote.map(function(op){
        return { tabela:op.tabela, tipo:op.tipo, id:op.id, item:op.item, parcial:op.parcial };
      }));
    } else {
      var tabelas = [];
      lote.forEach(function(op){ if(tabelas.indexOf(op.tabela) === -1) tabelas.push(op.tabela); });
      envio = tabelas.reduce(function(p, t){
        return p.then(function(){ return apiPost(ACAO_LEGADO[t], lista(t)); });
      }, Promise.resolve());
    }
    envio.then(function(){
      var enviados = {};
      lote.forEach(function(op){ enviados[op.uid] = true; });
      fila = fila.filter(function(op){ return !enviados[op.uid]; });
      gravarFila();
      syncSeq++;
      enviando = false;
      if(envioFalhou){
        envioFalhou = false;
        renderNotices();
        if(!fila.length) aviso('Alterações pendentes enviadas para a planilha.');
      }
      if(fila.length) enviarFila();
    }).catch(function(){
      enviando = false;
      envioFalhou = true;
      renderNotices();
      reenvioTimer = setTimeout(enviarFila, 20000);
    });
  }

  function enviarAgora(){
    if(reenvioTimer){ clearTimeout(reenvioTimer); reenvioTimer = null; }
    enviarFila();
  }

  function dadosDe(all){
    return {
      usuarios: all.usuarios || [],
      itensExpo: all.itensExpo || [],
      itensVal: all.itensVal || [],
      itensPlaca: all.itensPlaca || []
    };
  }

  function loadAll(){
    return apiGet('getAll').then(function(all){
      backendVersao = Number(all.versao) || 1;
      var dados = dadosDe(all);
      aplicarFilaEm(dados);
      TABELAS.forEach(function(t){ definirLista(t, dados[t]); });
      return apiGet('getProdutos');
    }).then(function(produtosArr){
      productDB = {};
      (Array.isArray(produtosArr) ? produtosArr : []).forEach(function(p){
        if(!p || !p.barcode) return;
        var rec = {};
        if(p.descricao) rec.descricao = p.descricao;
        if(p.codigoInterno) rec.codigoInterno = p.codigoInterno;
        productDB[String(p.barcode)] = rec;
      });
      rebuildProductIndex();
      apiOk = true; apiError = '';
      if(fila.length) enviarFila();
    }).catch(function(err){
      apiOk = false;
      apiError = String((err && err.message) || err);
    });
  }

  /* ---------- atualização automática ---------- */
  var POLL_INTERVAL_MS = 25000;
  var pollTimer = null;

  function startPolling(){
    stopPolling();
    pollTimer = setInterval(pollRefresh, POLL_INTERVAL_MS);
  }
  function stopPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }

  function alertasDoNavegador(){
    try{ return typeof Notification !== 'undefined' && Notification.permission === 'granted'; }catch(e){ return false; }
  }

  function pollRefresh(){
    if(!SHEETS_API_URL || !currentUser) return;
    // aba em segundo plano: só atualiza se a pessoa ativou os alertas do navegador
    if(document.hidden && !alertasDoNavegador()) return;
    var seq = syncSeq;
    apiGet('getAll').then(function(all){
      // se um envio terminou enquanto esta leitura viajava, ela pode estar
      // desatualizada: descarta e espera a próxima
      if(seq !== syncSeq) return;
      backendVersao = Number(all.versao) || 1;
      var dados = dadosDe(all);
      aplicarFilaEm(dados);
      TABELAS.forEach(function(t){ definirLista(t, dados[t]); });
      render();
      verificarNovidades(true);
    }).catch(function(){ /* tenta de novo no próximo ciclo */ });
  }

  document.addEventListener('visibilitychange', function(){
    if(!document.hidden){ pollRefresh(); enviarFila(); }
  });
  window.addEventListener('online', function(){ enviarFila(); pollRefresh(); });


  /* ---------- scanner ----------
     Abre em uma camada própria (não usa o modal), para que o formulário
     aberto por trás continue existindo com todos os valores preenchidos.
     Usa facingMode "environment" para abrir direto a câmera traseira,
     sem a tela de escolha de câmera. */
  var scanCallback = null;

  function setScanMsg(html){
    var el = document.getElementById('scan-msg');
    if(el) el.innerHTML = html || '';
  }

  function openScanner(onResult){
    scanCallback = onResult;
    document.getElementById('scanBackdrop').classList.add('open');
    document.getElementById('scanner-box').innerHTML = '';
    setScanMsg('Abrindo a câmera…');

    if(typeof Html5Qrcode === 'undefined'){
      setScanMsg('<div class="warn-box">Leitor de código indisponível neste navegador. Digite o código manualmente ou use "Ler de uma foto".</div>');
      return;
    }
    try{
      currentScanner = new Html5Qrcode('scanner-box', { formatsToSupport:FORMATS, verbose:false });
    }catch(e){
      setScanMsg('<div class="warn-box">Não foi possível iniciar o leitor. Digite o código manualmente.</div>');
      return;
    }

    var config = {
      fps: 10,
      qrbox: function(w, h){
        var side = Math.floor(Math.min(w, h));
        return { width: Math.floor(Math.min(w * 0.9, 320)), height: Math.floor(Math.min(side * 0.55, 170)) };
      },
      aspectRatio: 1.334,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };

    currentScanner.start(
      { facingMode: 'environment' },
      config,
      function(decodedText){ handleScanSuccess(decodedText); },
      function(){ /* ignora falhas de leitura por frame */ }
    ).then(function(){
      setScanMsg('Aponte a câmera para o código de barras.');
    }).catch(function(err){
      var msg = String((err && err.message) || err || '');
      if(/NotAllowedError|Permission/i.test(msg)){
        setScanMsg('<div class="warn-box">Permissão de câmera negada. Autorize o acesso à câmera nas configurações do navegador, ou use "Ler de uma foto".</div>');
      } else if(/NotFoundError|no camera/i.test(msg)){
        setScanMsg('<div class="warn-box">Nenhuma câmera encontrada neste dispositivo. Use "Ler de uma foto" ou digite o código.</div>');
      } else if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
        setScanMsg('<div class="warn-box">A câmera só funciona em endereços seguros (https). Abra o app pelo link publicado, ou use "Ler de uma foto".</div>');
      } else {
        setScanMsg('<div class="warn-box">Não foi possível abrir a câmera ('+esc(msg)+'). Use "Ler de uma foto" ou digite o código.</div>');
      }
    });
  }

  function handleScanSuccess(decodedText){
    var cb = scanCallback;
    stopScanner().then(function(){
      closeScanner();
      if(cb) cb(decodedText);
    });
  }

  function stopScanner(){
    if(!currentScanner) return Promise.resolve();
    var sc = currentScanner;
    currentScanner = null;
    return sc.stop().then(function(){
      try{ sc.clear(); }catch(e){}
    }).catch(function(){
      try{ sc.clear(); }catch(e){}
    });
  }

  function closeScanner(){
    stopScanner();
    scanCallback = null;
    document.getElementById('scanBackdrop').classList.remove('open');
    document.getElementById('scanner-box').innerHTML = '';
    setScanMsg('');
  }

  function scanFromFile(evt){
    var file = evt.target.files && evt.target.files[0];
    evt.target.value = '';
    if(!file) return;
    if(typeof Html5Qrcode === 'undefined'){
      setScanMsg('<div class="warn-box">Leitor indisponível neste navegador.</div>');
      return;
    }
    setScanMsg('Lendo a imagem…');
    var cb = scanCallback;
    stopScanner().then(function(){
      var tmp = new Html5Qrcode('scanner-box', { formatsToSupport:FORMATS, verbose:false });
      tmp.scanFile(file, true).then(function(decodedText){
        try{ tmp.clear(); }catch(e){}
        closeScanner();
        if(cb) cb(decodedText);
      }).catch(function(){
        try{ tmp.clear(); }catch(e){}
        setScanMsg('<div class="warn-box">Não foi possível ler o código nessa foto. Tente uma foto mais próxima e bem iluminada, ou digite o código manualmente.</div>');
      });
    });
  }

  /* ---------- product lookup (base nacional de produtos, via Cosmos/Bluesoft) ----------
     A chamada passa pelo Apps Script (não vai direto ao Cosmos) para que o
     token de acesso fique guardado no backend, nunca exposto no navegador. */
  function fetchProductInfo(barcode){
    if(!barcode || !SHEETS_API_URL) return Promise.resolve(null);
    var sep = SHEETS_API_URL.indexOf('?') === -1 ? '?' : '&';
    var url = SHEETS_API_URL + sep + 'action=lookupProduto&barcode=' + encodeURIComponent(barcode);
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var t = ctrl ? setTimeout(function(){ ctrl.abort(); }, 8000) : null;
    return fetch(url, ctrl ? {signal:ctrl.signal} : {}).then(function(res){
      if(t) clearTimeout(t);
      if(!res.ok) return null;
      return res.json();
    }).then(function(data){
      if(!data || data.ok === false || !data.produto) return null;
      var p = data.produto;
      var nome = p.nome || '';
      var foto = p.foto || null;
      if(!nome && !foto) return null;
      return { nome:nome, foto:foto };
    }).catch(function(){ if(t) clearTimeout(t); return null; });
  }


  var HEADER_SYNONYMS = {
    barcode: ['codigobarras','codigodebarras','codbarras','codbarra','ean','ean13','ean8','gtin','barcode','codigoean'],
    interno: ['codigointerno','codinterno','sku','codigoproduto','codproduto','codigosku','codigointernoproduto','codigodoproduto'],
    descricao: ['descricao','descricaoproduto','nome','nomeproduto','nomedoproduto','produto','desc'],
    foto: ['foto','imagem','fotourl','imagemurl','urlfoto','urlimagem','photo','image','urlimagemproduto']
  };
  function normalizeHeader(h){
    return String(h==null?'':h).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  }
  /* Ordem de prioridade importa: 'barcode' antes de 'interno', e
     'interno' antes de 'descricao', para que "Código de Barras" não caia
     em "código" genérico e "Nome SKU" não seja lido como código interno. */
  var HEADER_CONTAINS = [
    { key:'barcode',   parts:['codigodebarras','codigobarras','codbarras','codbarra','ean','gtin','barcode'] },
    { key:'foto',      parts:['foto','imagem','image','photo'] },
    { key:'interno',   parts:['codigointerno','codinterno','codigointerno','internocodigo','codigodoproduto','codigoproduto'] },
    { key:'descricao', parts:['descricao','nome','produto','desc','sku'] },
    { key:'interno',   parts:['sku','codigo','cod'] }
  ];

  function matchHeader(rawHeader){
    var norm = normalizeHeader(rawHeader);
    for(var key in HEADER_SYNONYMS){
      if(HEADER_SYNONYMS[key].indexOf(norm) !== -1) return key;
    }
    // Sem correspondência exata: tenta por conteúdo (ex.: "Nome SKU", "Cód. Barras EAN")
    for(var i=0;i<HEADER_CONTAINS.length;i++){
      var rule = HEADER_CONTAINS[i];
      for(var j=0;j<rule.parts.length;j++){
        if(norm.indexOf(rule.parts[j]) !== -1) return rule.key;
      }
    }
    return null;
  }
  function mapRowsToProducts(rows){
    var map = {}, count = 0;
    if(!rows || !rows.length) return {map:map, count:0};
    var headerKeys = Object.keys(rows[0]);
    var fieldFor = {};
    headerKeys.forEach(function(h){
      var f = matchHeader(h);
      if(f && !fieldFor[f]) fieldFor[f] = h;
    });
    if(!fieldFor.barcode) return {map:map, count:0};
    rows.forEach(function(row){
      var bc = String(row[fieldFor.barcode]==null?'':row[fieldFor.barcode]).trim().replace(/\s+/g,'');
      if(!bc) return;
      map[bc] = {
        codigoInterno: fieldFor.interno ? String(row[fieldFor.interno]==null?'':row[fieldFor.interno]).trim() : '',
        descricao: fieldFor.descricao ? String(row[fieldFor.descricao]==null?'':row[fieldFor.descricao]).trim() : '',
        foto: fieldFor.foto ? String(row[fieldFor.foto]==null?'':row[fieldFor.foto]).trim() : ''
      };
      count++;
    });
    return {map:map, count:count};
  }
  function parseSpreadsheetFile(file){
    return new Promise(function(resolve,reject){
      if(typeof XLSX === 'undefined'){ reject(new Error('XLSX indisponível')); return; }
      var reader = new FileReader();
      reader.onload = function(e){
        try{
          var data = new Uint8Array(e.target.result);
          var wb = XLSX.read(data, {type:'array'});
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sheet, {defval:'', raw:false});
          resolve(rows);
        }catch(err){ reject(err); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }

  function lookupInternal(barcode){
    if(!barcode) return null;
    return productDB[String(barcode).trim()] || null;
  }

  /* ---------- índices de busca da base de produtos ---------- */
  var dbIndexInterno = {};   // codigoInterno -> {barcode, ...}
  var dbSearchList = [];     // [{barcode, descricao, codigoInterno, foto, busca}]
  var AC_LIMIT = 8;          // quantidade de sugestões exibidas (bom para celular)

  function normalizeSearch(s){
    return String(s||'')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase().replace(/\s+/g,' ').trim();
  }

  function rebuildProductIndex(){
    dbIndexInterno = {};
    dbSearchList = [];
    for(var bc in productDB){
      var p = productDB[bc] || {};
      var ci = String(p.codigoInterno||'').trim();
      if(ci && !dbIndexInterno[ci]) dbIndexInterno[ci] = { barcode:bc, descricao:p.descricao||'', codigoInterno:ci, foto:p.foto||'' };
      dbSearchList.push({
        barcode: bc,
        descricao: p.descricao||'',
        codigoInterno: ci,
        foto: p.foto||'',
        busca: normalizeSearch((p.descricao||'') + ' ' + ci + ' ' + bc)
      });
    }
  }

  function lookupByInterno(codigo){
    codigo = String(codigo||'').trim();
    if(!codigo) return null;
    if(dbIndexInterno[codigo]) return dbIndexInterno[codigo];
    // tenta sem zeros à esquerda, comum em planilhas
    var stripped = codigo.replace(/^0+/,'');
    for(var k in dbIndexInterno){
      if(k.replace(/^0+/,'') === stripped) return dbIndexInterno[k];
    }
    return null;
  }

  /* Busca por nome: todos os termos digitados precisam aparecer no item,
     em qualquer ordem. Ex.: "desod rexona 150" encontra
     "DESOD REXONA AERO 150ML ...". */
  function searchProducts(query, limit){
    limit = limit || AC_LIMIT;
    var q = normalizeSearch(query);
    if(q.length < 2) return { list:[], total:0 };
    var terms = q.split(' ').filter(Boolean);
    var out = [], total = 0;
    for(var i=0;i<dbSearchList.length;i++){
      var item = dbSearchList[i];
      var ok = true;
      for(var t=0;t<terms.length;t++){
        if(item.busca.indexOf(terms[t]) === -1){ ok = false; break; }
      }
      if(ok){
        total++;
        if(out.length < limit) out.push(item);
        else if(total > 500) break; // evita varrer 21 mil itens desnecessariamente
      }
    }
    return { list:out, total:total };
  }



  /* ---------- janelas, diálogos e avisos rápidos ---------- */

  function cabecalhoModal(titulo){
    return '<div class="modal-head"><h3>' + titulo + '</h3>' +
